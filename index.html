<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 3;  // slightly higher res for fine creases

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Many fine creases — like real sheer fabric ───────
// Real sheers have 50+ fine vertical lines from the gathering tape,
// staying close together and nearly parallel top to bottom.
// The spread from top to bottom is very subtle — not a dramatic fan.

const NUM_FOLDS = 55;
const GATHER    = 0.82;  // only 18% compression at top — subtle gather

const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const even = (i + 0.5) / NUM_FOLDS;

  const topX = 0.5 + (even - 0.5) * GATHER;
  const botX = 0.01 + even * 0.98;

  // Vary fold character — every 3rd fold is slightly deeper
  const tier = i % 3;
  const depth  = tier === 0 ? 0.28 : tier === 1 ? 0.18 : 0.22;
  const sigmaT = tier === 0 ? 0.005 : tier === 1 ? 0.003 : 0.004;
  const sigmaB = tier === 0 ? 0.018 : tier === 1 ? 0.012 : 0.015;

  FOLDS.push({
    topX,
    botX,
    sigmaT,
    sigmaB,
    depthT: depth * 1.3,   // deeper when compressed at top
    depthB: depth,
    phase:  (i * 1.37) % (Math.PI * 2),
    weight: tier === 0 ? 1.0 : 0.7,
  });
}

// ─── Breeze ───────────────────────────────────────────
// Gentle belly push — the whole curtain billows softly outward
// in the middle, not a dramatic bottom swing.

function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.50 + phase)                * 0.035 +
    Math.sin(t * 1.05 + phase * 1.7 + 1.4)   * 0.016 +
    Math.sin(t * 0.20 + phase * 0.6 + 2.8)   * 0.025
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
  }
  // 4-pass neighbour blur — strong fabric tension coupling
  for (let pass = 0; pass < 4; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const p2 = i > 1             ? src[i - 2] : src[Math.max(0, i - 1)];
      const p1 = i > 0             ? src[i - 1] : src[i];
      const n1 = i < NUM_FOLDS - 1 ? src[i + 1] : src[i];
      const n2 = i < NUM_FOLDS - 2 ? src[i + 2] : src[Math.min(NUM_FOLDS - 1, i + 1)];
      swingSmooth[i] = src[i] * 0.36 + (p1 + n1) * 0.20 + (p2 + n2) * 0.07;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_FX    = new Float32Array(NUM_FOLDS);
const ROW_S2    = new Float32Array(NUM_FOLDS);
const ROW_DEPTH = new Float32Array(NUM_FOLDS);

function precomputeRow(ny) {
  // Very subtle spread — the creases stay mostly vertical
  const spread = Math.pow(ny, 0.8);

  // Breeze hang: gentle belly, not bottom-heavy
  // Peaks around 60-70% height (mid-to-lower), less at very bottom (hem weight)
  const belly = Math.sin(ny * Math.PI) * 0.85 + ny * 0.15;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f = FOLDS[i];

    const baseX   = f.topX + (f.botX - f.topX) * spread;
    ROW_FX[i]     = baseX + swingSmooth[i] * belly;

    const sigma   = f.sigmaT + (f.sigmaB - f.sigmaT) * spread;
    ROW_S2[i]     = sigma * sigma;

    ROW_DEPTH[i]  = f.depthT + (f.depthB - f.depthT) * spread;
  }
}

// ─── Pixel light ──────────────────────────────────────
function lightAt(nx) {
  let light = 1.0;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx  = ROW_FX[i];
    const s2  = ROW_S2[i];
    const dep = ROW_DEPTH[i];
    const d   = nx - fx;
    const d2  = d * d;

    // Shadow — fine Lorentzian crease line
    light -= dep / (1 + d2 / s2);

    // Highlight — subtle bright ridge just right of shadow
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.60;
    const hs2   = s2 * 0.20;
    light += (dep * 0.45) / (1 + (hd * hd) / hs2);
  }

  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    // Light coming through: brighter in center, dimmer at edges
    // Simulates the window light behind the sheer fabric
    for (let x = 0; x < SW; x++) {
      const nx = x / SW;

      const lum = lightAt(nx);

      // Window light: warm glow from behind, brightest center-bottom
      const cx = nx - 0.5;
      const cy = ny - 0.55;
      const windowLight = Math.exp(-(cx * cx * 1.8 + cy * cy * 2.5)) * 0.18;

      const l = Math.max(0, Math.min(1.2, lum + windowLight));

      // Warm white palette — ivory, not grey
      // Shadow: warm grey rgb(185, 180, 172)
      // Peak: warm white rgb(255, 253, 248)
      // Through-light: slightly golden
      const warmth = windowLight * 2.5;  // adds golden tone where light comes through

      const r = Math.min(255, Math.round(185 + l * 70  + warmth * 30));
      const g = Math.min(255, Math.round(180 + l * 73  + warmth * 22));
      const b = Math.min(255, Math.round(172 + l * 76  + warmth * 5));

      // Translucent: the fabric is sheer — high base alpha, slightly more opaque in shadow
      const a = Math.round(Math.min(255, 165 + (1 - Math.min(1, l)) * 50));

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  // Very fine rod shadow at top
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.04);
  rod.addColorStop(0,   'rgba(160,155,145,0.30)');
  rod.addColorStop(0.5, 'rgba(160,155,145,0.06)');
  rod.addColorStop(1,   'rgba(160,155,145,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.04);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
