<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f2f0ed; }

    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 62% 68%,
          rgba(255, 185, 120, 0.55) 0%,
          rgba(255, 170, 100, 0.18) 50%,
          transparent 80%),
        radial-gradient(ellipse 50% 35% at 55% 78%,
          rgba(255, 145, 80, 0.30) 0%,
          transparent 60%),
        radial-gradient(ellipse 80% 50% at 40% 18%,
          rgba(180, 200, 225, 0.30) 0%,
          rgba(180, 200, 225, 0.08) 55%,
          transparent 80%),
        linear-gradient(178deg,
          #d8e0ea 0%,
          #e2e5ea 18%,
          #ece8e2 35%,
          #f2e8d8 52%,
          #f8dcc0 68%,
          #fad2a8 82%,
          #f5c898 100%);
      pointer-events: none;
    }

    canvas { position: fixed; inset: 0; display: block; cursor: default; }
  </style>
</head>
<body>
<div class="sky"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Folds ────────────────────────────────────────────
const NUM_FOLDS = 26;
const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const nx = (i + 0.5) / NUM_FOLDS;
  const isMain = i % 2 === 0;
  FOLDS.push({
    relPos: 0.02 + nx * 0.96,
    sigmaT: isMain ? 0.028 : 0.020,
    sigmaB: isMain ? 0.055 : 0.038,
    depth:  isMain ? 0.30  : 0.18,
    phase:  (i * 1.37) % (Math.PI * 2),
    weight: isMain ? 1.0 : 0.6,
  });
}

// ═══════════════════════════════════════════════════════
//  INTERACTION STATE
// ═══════════════════════════════════════════════════════

// ── Opening gust: strong breeze that decays over ~4 seconds ──
const startTime  = performance.now();
const gustDecay  = 4.0;   // seconds to calm down
const gustPeak   = 4.5;   // multiplier on top of normal breeze

// ── Mouse interaction ────────────────────────────────
// Track mouse position + velocity. The velocity creates a push
// force on nearby folds, like a hand brushing through fabric.
let mouseX  = -1;   // normalized 0..1, -1 = not on screen
let mouseY  = -1;
let mouseVX = 0;    // velocity (normalized units per second)
let mouseVY = 0;
let prevMouseX = -1;
let prevMouseY = -1;
let lastMouseTime = 0;

// Per-fold mouse push force (decays over time)
const mousePush = new Float32Array(NUM_FOLDS);

canvas.addEventListener('mousemove', (e) => {
  const now = performance.now() * 0.001;
  const nx  = e.clientX / innerWidth;
  const ny  = e.clientY / innerHeight;

  if (prevMouseX >= 0) {
    const dt = Math.max(0.001, now - lastMouseTime);
    mouseVX  = (nx - prevMouseX) / dt;
    mouseVY  = (ny - prevMouseY) / dt;
  }

  mouseX = nx;
  mouseY = ny;
  prevMouseX = nx;
  prevMouseY = ny;
  lastMouseTime = now;
});

canvas.addEventListener('mouseleave', () => {
  mouseX = -1;
  mouseY = -1;
  prevMouseX = -1;
  prevMouseY = -1;
  mouseVX = 0;
  mouseVY = 0;
});

// Touch support
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const now   = performance.now() * 0.001;
  const nx    = touch.clientX / innerWidth;
  const ny    = touch.clientY / innerHeight;

  if (prevMouseX >= 0) {
    const dt = Math.max(0.001, now - lastMouseTime);
    mouseVX  = (nx - prevMouseX) / dt;
    mouseVY  = (ny - prevMouseY) / dt;
  }

  mouseX = nx;
  mouseY = ny;
  prevMouseX = nx;
  prevMouseY = ny;
  lastMouseTime = now;
}, { passive: false });

canvas.addEventListener('touchend', () => {
  mouseX = -1;
  mouseY = -1;
  prevMouseX = -1;
  prevMouseY = -1;
  mouseVX = 0;
  mouseVY = 0;
});

// ─── Breeze with gust + mouse + neighbour propagation ─
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.55 + phase)               * 0.060 +
    Math.sin(t * 1.15 + phase * 1.8 + 1.4)  * 0.028 +
    Math.sin(t * 0.22 + phase * 0.7 + 2.8)  * 0.042
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t, dt) {
  // ── Opening gust multiplier ──────────────────────
  const elapsed  = (performance.now() - startTime) * 0.001;
  const gustMult = 1.0 + gustPeak * Math.exp(-elapsed / gustDecay)
                       * (0.5 + 0.5 * Math.sin(elapsed * 3.5)); // ripple during gust

  // ── Update mouse push per fold ───────────────────
  // Mouse velocity creates a lateral force on nearby folds
  if (mouseX >= 0) {
    const pushStrength = Math.min(4, Math.abs(mouseVX)) * Math.sign(mouseVX);
    const influence    = 0.12;  // how wide the mouse affects (in normalized x)

    for (let i = 0; i < NUM_FOLDS; i++) {
      const foldNX = FOLDS[i].relPos;
      const dist   = Math.abs(foldNX - mouseX);
      if (dist < influence) {
        const falloff = 1 - (dist / influence);
        // Stronger push from faster mouse, scaled by how close the fold is
        mousePush[i] += pushStrength * falloff * falloff * dt * 2.5;
      }
    }
  }

  // Decay mouse push
  for (let i = 0; i < NUM_FOLDS; i++) {
    mousePush[i] *= Math.pow(0.03, dt);  // ~97% decay per second → snappy return
  }

  // ── Combine base swing + gust + mouse ───────────
  for (let i = 0; i < NUM_FOLDS; i++) {
    const base  = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
    swingRaw[i] = base * gustMult + mousePush[i] * 0.035;
  }

  // ── Neighbour propagation ────────────────────────
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const prev = i > 0             ? src[i-1] : src[i];
      const next = i < NUM_FOLDS - 1 ? src[i+1] : src[i];
      swingSmooth[i] = src[i] * 0.50 + prev * 0.25 + next * 0.25;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_DATA = new Float32Array(NUM_FOLDS * 2);

function precomputeRow(ny) {
  const hang = Math.pow(ny, 0.50);
  const extraLoose = ny > 0.7 ? (ny - 0.7) / 0.3 : 0;
  const totalHang  = hang + extraLoose * 0.4;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f     = FOLDS[i];
    const fx    = f.relPos + swingSmooth[i] * totalHang;
    const blend = Math.pow(ny, 0.7);
    const sigma = f.sigmaT + (f.sigmaB - f.sigmaT) * blend;
    ROW_DATA[i * 2]     = fx;
    ROW_DATA[i * 2 + 1] = sigma * sigma;
  }
}

// ─── Pixel light ──────────────────────────────────────
function lightAt(nx) {
  let light = 1.0;
  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx = ROW_DATA[i * 2];
    const s2 = ROW_DATA[i * 2 + 1];
    const d  = nx - fx;
    const d2 = d * d;
    light -= FOLDS[i].depth / (1 + d2 / s2);
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.68;
    const hs2   = s2 * 0.25;
    light += (FOLDS[i].depth * 1.00) / (1 + (hd * hd) / hs2);
  }
  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache  = null;
let lastFrame = 0;

function draw(ms) {
  const t  = ms * 0.001;
  const dt = lastFrame ? Math.min(0.1, t - lastFrame) : 0.016;
  lastFrame = t;

  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t, dt);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    const vertLight = 1.0 - ny * 0.06;

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx) * vertLight;
      const l   = Math.max(0, Math.min(1.20, lum));

      const breathe   = Math.sin(t * 0.06) * 0.12 + Math.sin(t * 0.025) * 0.08;
      const warmZone  = nx * 0.35 + (1.0 - ny) * 0.45 + breathe;
      const warmRaw   = Math.max(0, Math.min(1, (warmZone - 0.20) / 0.55));
      const warmth    = warmRaw * warmRaw * (3 - 2 * warmRaw);
      const peach     = warmth * Math.max(0, Math.min(1, (l - 0.3) / 0.5));

      const r = Math.min(255, Math.round(55  + l * 200 + peach * 55));
      const g = Math.min(255, Math.round(65  + l * 190 + peach * 30));
      const b = Math.min(255, Math.round(105 + l * 150 - peach * 22));
      const a = 255;

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  rod.addColorStop(0,   'rgba(140,148,170,0.22)');
  rod.addColorStop(0.5, 'rgba(140,148,170,0.05)');
  rod.addColorStop(1,   'rgba(140,148,170,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.06);

  const hem = ctx.createLinearGradient(0, H * 0.85, 0, H);
  hem.addColorStop(0, 'rgba(240,175,110,0)');
  hem.addColorStop(1, 'rgba(240,175,110,0.14)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
