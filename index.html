<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #e8ecf2; }

    /* Morning sky — navy top melting into peachy sunrise at bottom */
    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 62% 68%,
          rgba(255, 185, 120, 0.55) 0%,
          rgba(255, 170, 100, 0.18) 50%,
          transparent 80%),
        radial-gradient(ellipse 50% 35% at 55% 78%,
          rgba(255, 145, 80, 0.30) 0%,
          transparent 60%),
        radial-gradient(ellipse 80% 50% at 40% 18%,
          rgba(120, 155, 210, 0.35) 0%,
          rgba(120, 155, 210, 0.08) 55%,
          transparent 80%),
        linear-gradient(178deg,
          #b0c0d8 0%,
          #c5d2e2 18%,
          #dde2ea 35%,
          #ece5dc 52%,
          #f5dcc5 68%,
          #f8d0a8 82%,
          #f2c498 100%);
      pointer-events: none;
    }

    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<div class="sky"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Generate 26 folds with varied character ──────────
// Each fold has:
//   relPos  – anchor X at the rod
//   sigmaT  – crease width at top (tight, gathered)
//   sigmaB  – crease width at bottom (loose, open)
//   depth   – shadow intensity
//   phase   – individual breeze timing
//   weight  – how much this fold's motion propagates to neighbours

const NUM_FOLDS = 26;
const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const nx = (i + 0.5) / NUM_FOLDS;
  // Alternate between deeper main folds and shallower secondary folds
  const isMain = i % 2 === 0;
  FOLDS.push({
    relPos: 0.02 + nx * 0.96,
    sigmaT: isMain ? 0.028 : 0.020,
    sigmaB: isMain ? 0.055 : 0.038,
    depth:  isMain ? 0.30  : 0.18,
    phase:  (i * 1.37) % (Math.PI * 2),   // golden-ratio-ish stagger
    weight: isMain ? 1.0 : 0.6,
  });
}

// ─── Breeze system with neighbour propagation ─────────
// Each fold has a base swing. Then each fold's displacement
// is blended with its neighbours — so when one fold moves,
// the fabric on either side gets dragged along.

// Base swing for a single fold — pure time function, NO ny
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.55 + phase)                * 0.060 +
    Math.sin(t * 1.15 + phase * 1.8 + 1.4)   * 0.028 +
    Math.sin(t * 0.22 + phase * 0.7 + 2.8)   * 0.042
  );
}

// Precompute base swings, then blur them across neighbours
const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  // Step 1: raw individual swings
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
  }

  // Step 2: propagate to neighbours — 3-pass gaussian-ish blur
  // This simulates fabric tension: when fold 5 moves, folds 4 & 6 get pulled
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const prev = i > 0              ? src[i - 1] : src[i];
      const next = i < NUM_FOLDS - 1  ? src[i + 1] : src[i];
      // 50% self + 25% each neighbour — strong coupling
      swingSmooth[i] = src[i] * 0.50 + prev * 0.25 + next * 0.25;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_DATA = new Float32Array(NUM_FOLDS * 2); // [fx, s2, fx, s2, ...]

function precomputeRow(ny) {
  // hang: exponential loosening — very stiff at top, very loose at bottom
  // Using a steeper curve (0.5) so bottom half really swings
  const hang = Math.pow(ny, 0.50);

  // Additional loosening: bottom 30% gets extra amplitude
  const extraLoose = ny > 0.7 ? (ny - 0.7) / 0.3 : 0;
  const totalHang  = hang + extraLoose * 0.4;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f     = FOLDS[i];
    const fx    = f.relPos + swingSmooth[i] * totalHang;
    // Sigma widens gently — soft at top, wider at bottom
    const blend = Math.pow(ny, 0.7);  // opens early, already soft near rod
    const sigma = f.sigmaT + (f.sigmaB - f.sigmaT) * blend;
    ROW_DATA[i * 2]     = fx;
    ROW_DATA[i * 2 + 1] = sigma * sigma;
  }
}

// ─── Pixel light function ─────────────────────────────
function lightAt(nx) {
  let light = 1.0;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx  = ROW_DATA[i * 2];
    const s2  = ROW_DATA[i * 2 + 1];
    const d   = nx - fx;
    const d2  = d * d;

    // Shadow — Lorentzian
    light -= FOLDS[i].depth / (1 + d2 / s2);

    // Highlight — offset, narrower
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.68;
    const hs2   = s2 * 0.25;
    light += (FOLDS[i].depth * 0.58) / (1 + (hd * hd) / hs2);
  }

  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  // Compute this frame's breeze swings (with neighbour propagation)
  computeSwings(t);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    const vertLight = 1.0 - ny * 0.06;

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx) * vertLight;
      const l   = Math.max(0, Math.min(1.20, lum));

      // ── Moving morning sun ────────────────────────
      // Slow arc from lower-right upward — ~3 min cycle
      const sunX = 0.60 + Math.sin(t * 0.035) * 0.12;
      const sunY = 0.62 + Math.cos(t * 0.035) * 0.18;

      const sx = nx - sunX;
      const sy = ny - sunY;

      // Main sun glow — large soft peach circle
      const sunGlow = Math.exp(-(sx*sx*1.8 + sy*sy*2.2)) * 0.50;
      // Tighter bright core
      const sunCore = Math.exp(-(sx*sx*5.0 + sy*sy*6.0)) * 0.25;

      const peach = (sunGlow + sunCore) * l;  // only shows where fabric is lit

      // ── Navy shadow → white → peachy highlight ────
      // Shadow: navy   rgb(55, 65, 105)
      // Mid:    white  rgb(255, 255, 255)
      // Sun areas get peach boost on top

      const r = Math.min(255, Math.round(55 + l * 200 + peach * 60));
      const g = Math.min(255, Math.round(65 + l * 190 + peach * 32));
      const b = Math.min(255, Math.round(105 + l * 150 - peach * 15));
      const a = Math.round(Math.min(255, 150 + (1 - Math.min(1, l)) * 62));

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  // Upscale with bilinear smoothing → natural blur
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  // Rod shadow — navy
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  rod.addColorStop(0,   'rgba(40,50,85,0.30)');
  rod.addColorStop(0.5, 'rgba(40,50,85,0.06)');
  rod.addColorStop(1,   'rgba(40,50,85,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.06);

  // Hem — warm peach reflected light from floor
  const hem = ctx.createLinearGradient(0, H * 0.85, 0, H);
  hem.addColorStop(0, 'rgba(240,175,110,0)');
  hem.addColorStop(1, 'rgba(240,175,110,0.14)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
