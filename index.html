<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(ellipse 90% 70% at 40% 10%, #fffaf2 0%, #f5edde 40%, #e8e0d2 100%);
    }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ─── Cloth resolution ────────────────────────────────
const COLS = 160;   // vertical strips across screen
const ROWS = 120;   // sample points down each strip

// ─── Displacement: how far each point moves horizontally
function xDisplace(col, y, W, H, t) {
  const nx = col / COLS;          // 0..1 across fabric
  const ny = y / H;               // 0..1 down fabric

  // Hang factor — top is fixed, bottom swings freely
  const hang = Math.pow(ny, 0.6);

  // ── Permanent creases from gathering at the rod ──
  const crease =
    Math.sin(nx * Math.PI * 5.0 + 0.3)  * 52 +
    Math.sin(nx * Math.PI * 11.0 + 1.7) * 24 +
    Math.sin(nx * Math.PI * 19.0 + 3.1) * 10;

  // ── Breeze — slow waves traveling upward through fabric ──
  const b1 = Math.sin(ny * 4.5  - t * 0.9  + nx * Math.PI * 3.0)       * 38 * hang;
  const b2 = Math.sin(ny * 8.0  - t * 0.6  + nx * Math.PI * 5.5 + 1.3) * 20 * hang;
  const b3 = Math.sin(ny * 14.0 - t * 1.3  + nx * Math.PI * 9.0 + 2.7) *  9 * hang;

  // ── Secondary slow swell — whole fabric breathes ──
  const swell = Math.sin(t * 0.35 + nx * Math.PI * 2.0) * 18 * hang;

  return crease + b1 + b2 + b3 + swell;
}

// ─── Draw ─────────────────────────────────────────────
function draw(ms) {
  const t = ms * 0.001;
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  const stripW = W / COLS;

  // Precompute a 2D grid of displaced X positions
  // grid[col][row] = screen X of that cloth point
  const grid = [];
  for (let c = 0; c <= COLS; c++) {
    const col = [];
    for (let r = 0; r <= ROWS; r++) {
      const y  = (r / ROWS) * H;
      const sx = (c / COLS) * W + xDisplace(c, y, W, H, t);
      col.push(sx);
    }
    grid.push(col);
  }

  // Draw each quad (one per col × row cell)
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const y0 = (r       / ROWS) * H;
      const y1 = ((r + 1) / ROWS) * H;

      const x00 = grid[c    ][r    ];  // top-left
      const x10 = grid[c + 1][r    ];  // top-right
      const x01 = grid[c    ][r + 1];  // bottom-left
      const x11 = grid[c + 1][r + 1];  // bottom-right

      // Surface normal X component ≈ horizontal slope of the strip
      // How much the strip tilts left/right tells us the fold angle
      const midX0 = (x00 + x01) * 0.5;
      const midX1 = (x10 + x11) * 0.5;
      const slope = (midX1 - midX0) / stripW;  // ~1 when neutral, varies with folds

      // Light from upper-left: bright on ridges (low slope), dark in valleys (high slope)
      // Clamp to [0,1]
      const normalFacing = Math.max(0, Math.min(1, 0.5 - slope * 0.55));

      // Fabric base: off-white, warm
      // bright peak ≈ rgb(255,254,251), deep shadow ≈ rgb(195,192,186)
      const brightness = 195 + Math.round(normalFacing * 60);
      const r_ch = brightness;
      const g_ch = brightness - 2;
      const b_ch = brightness - 8;

      // Transparency — fabric is semi-translucent; overlapping folds compound
      ctx.globalAlpha = 0.72;
      ctx.fillStyle   = `rgb(${r_ch},${g_ch},${b_ch})`;

      ctx.beginPath();
      ctx.moveTo(x00, y0);
      ctx.lineTo(x10, y0);
      ctx.lineTo(x11, y1);
      ctx.lineTo(x01, y1);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ── Subtle top shadow (rod hang) ──
  ctx.globalAlpha = 1;
  const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  topGrad.addColorStop(0,   'rgba(160,152,140,0.35)');
  topGrad.addColorStop(1,   'rgba(160,152,140,0)');
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, W, H * 0.06);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
