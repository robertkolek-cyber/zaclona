<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { width: 100%; background: #fff; }
    body { width: 100%; min-height: 400vh; margin: 0; padding: 0; background: #fff; }
    canvas { position: fixed; inset: 0; display: block; pointer-events: none; z-index: 1; }

    .project-tile {
      position: fixed;
      top: 42%;
      left: clamp(24px, 5vw, 80px);
      transform: translateY(-50%);
      z-index: 2;
      text-align: left;
      pointer-events: none;
      will-change: transform, opacity;
      mix-blend-mode: difference;
    }

    /* ── Word-mask rise ── */
    @keyframes word-rise {
      from { transform: translateY(108%); }
      to   { transform: translateY(0); }
    }

    /* ── Difference blend materialises as color goes black→white ── */
    @keyframes blend-appear {
      from { color: #000; }
      to   { color: #fff; }
    }

    /* ── Subtitle slides up + fades ── */
    @keyframes sub-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .project-tile h1 {
      font-family: 'Instrument Sans', sans-serif;
      font-size: clamp(24px, 3.8vw, 78px);
      font-weight: 600;
      color: #000;
      line-height: 1.15;
      letter-spacing: -0.02em;
      white-space: nowrap;
      margin-bottom: clamp(10px, 1.4vw, 20px);
      /* blend materialises over the full word-rise duration */
      animation: blend-appear 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    /* Each word is clipped by overflow:hidden on the outer span */
    .word {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }

    /* Inner span is what actually moves */
    .wi {
      display: inline-block;
      transform: translateY(108%);
      animation: word-rise 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .project-tile p {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(10px, 1.1vw, 14px);
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-align: right;
      opacity: 0;
      animation: sub-in 1.0s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }

    .name-lockup {
      position: fixed;
      bottom: clamp(24px, 4vw, 40px);
      left: 0;
      font-family: 'Instrument Sans', sans-serif;
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: 600;
      color: #000;
      white-space: nowrap;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: difference;
      will-change: transform, opacity;
      animation: blend-appear 1.4s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards;
    }
    .name-lockup .word { display: inline-block; overflow: hidden; vertical-align: bottom; }
    .name-lockup .wi {
      display: inline-block;
      transform: translateY(108%);
      animation: word-rise 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

  </style>
</head>
<body>

<div class="name-lockup" id="nameLockup">Portfolio of Robert Kolek</div>

<div class="project-tile" id="tile">
  <h1>The real design is always underneath</h1>
  <p>scroll to explore</p>
</div>


<canvas id="c"></canvas>
<script>
// ─── Word-mask split ─────────────────────────────────
// Wraps each word in <span class="word"><span class="wi">…</span></span>
// The outer span clips (overflow:hidden), inner span rises up.
// Stagger: 85ms per word, starting at 0.15s.
(function splitWords() {
  const h1 = document.querySelector('.project-tile h1');
  const words = h1.textContent.trim().split(' ');
  h1.innerHTML = words.map((w, i) =>
    `<span class="word"><span class="wi" style="animation-delay:${250 + i * 110}ms">${w}</span></span>`
  ).join(' ');

  // Same word-mask effect for name lockup, starting after headline
  const lockup = document.getElementById('nameLockup');
  const lWords = lockup.textContent.trim().split(' ');
  lockup.innerHTML = lWords.map((w, i) =>
    `<span class="word"><span class="wi" style="animation-delay:${2000 + i * 110}ms">${w}</span></span>`
  ).join(' ');
})();

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

const tile       = document.getElementById('tile');
const nameLockup = document.getElementById('nameLockup');


function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Scroll state with inertia ───────────────────────
let scrollPull  = 0;
let curtainPull = 0;
let curtainVel  = 0;

function updateScroll() {
  const maxScroll = document.documentElement.scrollHeight - innerHeight;
  scrollPull = maxScroll > 0 ? Math.min(1, window.scrollY / maxScroll) : 0;
}
window.addEventListener('scroll', updateScroll, { passive: true });

// ─── Generate folds ──────────────────────────────────
const NUM_FOLDS = 26;
const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const nx = (i + 0.5) / NUM_FOLDS;
  const isMain = i % 2 === 0;
  FOLDS.push({
    relPos: 0.02 + nx * 0.96,
    sigmaT: isMain ? 0.028 : 0.020,
    sigmaB: isMain ? 0.055 : 0.038,
    depth:  isMain ? 0.30  : 0.18,
    phase:  (i * 1.37) % (Math.PI * 2),
    weight: isMain ? 1.0 : 0.6,
  });
}

// ─── Breeze ──────────────────────────────────────────
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.55 + phase)                * 0.060 +
    Math.sin(t * 1.15 + phase * 1.8 + 1.4)   * 0.028 +
    Math.sin(t * 0.22 + phase * 0.7 + 2.8)   * 0.042
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
  }
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const prev = i > 0              ? src[i - 1] : src[i];
      const next = i < NUM_FOLDS - 1  ? src[i + 1] : src[i];
      swingSmooth[i] = src[i] * 0.50 + prev * 0.25 + next * 0.25;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_DATA = new Float32Array(NUM_FOLDS * 2);

const foldPull     = new Float32Array(NUM_FOLDS);
const foldPullVel  = new Float32Array(NUM_FOLDS);

function updateFoldPull(dt) {
  const pullSpringK = 8.0;
  const pullDamping = 4.5;
  const pullAccel = pullSpringK * (scrollPull - curtainPull) - pullDamping * curtainVel;
  curtainVel  += pullAccel * dt;
  curtainPull += curtainVel * dt;
  curtainPull  = Math.max(0, Math.min(1.0, curtainPull));

  for (let i = 0; i < NUM_FOLDS; i++) {
    const foldNX = FOLDS[i].relPos;
    const responsiveness = 0.3 + foldNX * foldNX * 12.0;
    const foldThreshold = (1.0 - foldNX) * 0.7;
    const foldTarget = Math.max(0, (curtainPull - foldThreshold) / (1.0 - foldThreshold));
    const clampedTarget = Math.min(1, foldTarget);

    const accel = responsiveness * (clampedTarget - foldPull[i]) - 3.0 * foldPullVel[i];
    foldPullVel[i] += accel * dt;
    foldPull[i]    += foldPullVel[i] * dt;
    foldPull[i]     = Math.max(0, Math.min(1.2, foldPull[i]));
  }
}

function precomputeRow(ny) {
  const hang = Math.pow(ny, 0.50);
  const extraLoose = ny > 0.7 ? (ny - 0.7) / 0.3 : 0;
  const totalHang  = hang + extraLoose * 0.4;
  const dragLag = 1.0 - ny * ny * 0.18;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f = FOLDS[i];
    let fx = f.relPos + swingSmooth[i] * totalHang;

    const pull = foldPull[i] * dragLag;
    const gatheredX = -1.2 - (NUM_FOLDS - i) * 0.015;
    fx = fx * (1 - pull) + gatheredX * pull;

    const blend = Math.pow(ny, 0.7);
    let sigma = f.sigmaT + (f.sigmaB - f.sigmaT) * blend;
    sigma *= 1.0 - pull * 0.5;

    ROW_DATA[i * 2]     = fx;
    ROW_DATA[i * 2 + 1] = sigma * sigma;
  }
}

// ─── Pixel light ─────────────────────────────────────
function lightAt(nx) {
  let light = 1.0;
  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx  = ROW_DATA[i * 2];
    const s2  = ROW_DATA[i * 2 + 1];
    const d   = nx - fx;
    const d2  = d * d;
    light -= FOLDS[i].depth / (1 + d2 / s2);
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.68;
    const hs2   = s2 * 0.25;
    light += (FOLDS[i].depth * 1.00) / (1 + (hd * hd) / hs2);
  }
  return light;
}

// ─── Text animation state ─────────────────────────────
// Sync lockup left edge to the tile's left edge on each frame
function alignLockup() {
  const rect = tile.getBoundingClientRect();
  nameLockup.style.left = rect.left + 'px';
}

function updateText() {
  const textX = curtainPull * -55;
  tile.style.transform = `translate(${textX}vw, -50%)`;
  alignLockup();
  const rawOpacity = 1 - (curtainPull - 0.35) / (0.62 - 0.35);
  const opacity = Math.max(0, Math.min(1, rawOpacity));
  tile.style.opacity = opacity;
  if (curtainPull > 0.35) nameLockup.style.opacity = opacity;
}

// ─── Draw loop ───────────────────────────────────────
let imgCache  = null;
let lastFrame = 0;

function draw(ms) {
  const t  = ms * 0.001;
  const dt = lastFrame ? Math.min(0.05, t - lastFrame) : 0.016;
  lastFrame = t;

  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t);
  updateFoldPull(dt);
  updateText();

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    const vertLight = 1.0 - ny * 0.06;

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx) * vertLight;
      const l   = Math.max(0, Math.min(1.20, lum));

      const breathe   = Math.sin(t * 0.06) * 0.12 + Math.sin(t * 0.025) * 0.08;
      const warmZone  = nx * 0.35 + (1.0 - ny) * 0.45 + breathe;
      const warmRaw   = Math.max(0, Math.min(1, (warmZone - 0.20) / 0.55));
      const warmth    = warmRaw * warmRaw * (3 - 2 * warmRaw);
      const peach     = warmth * Math.max(0, Math.min(1, (l - 0.3) / 0.5));

      const r = Math.min(255, Math.round(55 + l * 200  + peach * 55));
      const g = Math.min(255, Math.round(65 + l * 190  + peach * 30));
      const b = Math.min(255, Math.round(105 + l * 150 - peach * 22));

      // Alpha: track rightmost fold edge per row
      let maxFoldX = -999;
      for (let fi = 0; fi < NUM_FOLDS; fi++) {
        const fx = ROW_DATA[fi * 2];
        const s2 = ROW_DATA[fi * 2 + 1];
        const edgeX = fx + Math.sqrt(s2) * 3.0;
        if (edgeX > maxFoldX) maxFoldX = edgeX;
      }
      const edgeFade = Math.max(0, Math.min(1, (maxFoldX - nx) / 0.03));
      const alpha = Math.round(edgeFade * 255);

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = alpha;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, W, H);

  // Rod shadow
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  rod.addColorStop(0,   'rgba(140,148,170,0.22)');
  rod.addColorStop(0.5, 'rgba(140,148,170,0.05)');
  rod.addColorStop(1,   'rgba(140,148,170,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.06);

  // Hem glow
  const hem = ctx.createLinearGradient(0, H * 0.85, 0, H);
  hem.addColorStop(0, 'rgba(240,175,110,0)');
  hem.addColorStop(1, 'rgba(240,175,110,0.14)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
