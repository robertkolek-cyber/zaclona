<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
}
window.addEventListener('resize', resize);
resize();

const COLS = 300;
const ROWS = 240;

// ─── Silk shading model ───────────────────────────────
// facing ∈ [0,1]: 0 = edge-on (shadow), 1 = face-on (peak)
//
// Silk is cool-neutral. Shadow: blue-grey. Peak: pure white.
// Strong specular spike right at the highlight — that's what
// makes silk look like silk instead of cotton.

function shadeColor(facing) {
  // Diffuse channel: shadow → white
  // Shadow has a cool cast (more blue than red)
  const sR = 155, sG = 158, sB = 168;  // cool grey shadow
  const hR = 255, hG = 255, hB = 255;  // pure white peak

  // Soft diffuse base
  const diffuse = Math.pow(facing, 1.4);  // slight roll-off

  let r = sR + diffuse * (hR - sR);
  let g = sG + diffuse * (hG - sG);
  let b = sB + diffuse * (hB - sB);

  // Specular spike — silk catches a sharp highlight near peak
  // Only activates when facing > 0.72
  const specFacing = Math.max(0, (facing - 0.72) / 0.28);
  const spec = Math.pow(specFacing, 3.5) * 38;

  // Specular is slightly cool-white (silk sheen)
  r = Math.min(255, r + spec * 0.90);
  g = Math.min(255, g + spec * 0.92);
  b = Math.min(255, b + spec * 1.00);  // fractionally more blue in spec

  return [Math.round(r), Math.round(g), Math.round(b)];
}

// ─── Displacement ────────────────────────────────────
function xDisplace(col, y, H, t) {
  const nx = col / COLS;
  const ny = y / H;

  // Silk hangs lightly — bottom floats, top pinned
  const hang = Math.pow(ny, 0.45);   // softer curve than linen

  // ── Main folds — elegant, fewer, wider ──
  // Silk drapes in large smooth waves, not tight gathers
  const fold =
    Math.sin(nx * Math.PI * 3.5 + 0.4)  * 38 +   // large primary folds
    Math.sin(nx * Math.PI * 7.0 + 1.8)  * 16 +   // secondary folds
    Math.sin(nx * Math.PI * 14.0 + 3.3) *  5;    // fine surface detail

  // ── Breeze — light and quick, silk catches air easily ──
  const b1 = Math.sin(ny * 3.2  - t * 1.00 + nx * Math.PI * 2.2)        * 28 * hang;
  const b2 = Math.sin(ny * 6.5  - t * 0.65 + nx * Math.PI * 4.0 + 1.6)  * 14 * hang;
  const b3 = Math.sin(ny * 11.8 - t * 1.40 + nx * Math.PI * 7.5 + 2.9)  *  6 * hang;

  // ── Full-cloth swell — slow and elegant ──
  const swell = Math.sin(t * 0.22 + nx * Math.PI * 1.5 + 0.8) * 18 * hang;

  return fold + b1 + b2 + b3 + swell;
}

// ─── Build grid ───────────────────────────────────────
function buildGrid(W, H, t) {
  const grid = [];
  for (let c = 0; c <= COLS; c++) {
    const strip = new Float32Array(ROWS + 1);
    for (let r = 0; r <= ROWS; r++) {
      strip[r] = (c / COLS) * W + xDisplace(c, (r / ROWS) * H, H, t);
    }
    grid.push(strip);
  }
  return grid;
}

// ─── Draw ─────────────────────────────────────────────
function draw(ms) {
  const t = ms * 0.001;
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  const colW = W / COLS;
  const grid = buildGrid(W, H, t);

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const y0 = (r       / ROWS) * H;
      const y1 = ((r + 1) / ROWS) * H;

      const x00 = grid[c    ][r    ];
      const x10 = grid[c + 1][r    ];
      const x01 = grid[c    ][r + 1];
      const x11 = grid[c + 1][r + 1];

      // Surface normal from horizontal slope
      const slope = ((x10 - x00) + (x11 - x01)) * 0.5 / colW;

      // Map slope → facing [0,1]
      // slope ~1 at rest; deviates with fold angle
      // Use tanh to get a smooth S-curve that emphasises edges
      const raw    = Math.max(0, Math.min(1, 0.5 - slope * 0.48));
      const facing = 0.5 * (1 + Math.tanh((raw - 0.5) * 4.5));

      const [r_ch, g_ch, b_ch] = shadeColor(facing);

      // Silk is more translucent than linen
      // Folds that overlap read naturally more opaque
      ctx.globalAlpha = 0.62;
      ctx.fillStyle   = `rgb(${r_ch},${g_ch},${b_ch})`;

      ctx.beginPath();
      ctx.moveTo(x00, y0);
      ctx.lineTo(x10, y0);
      ctx.lineTo(x11, y1);
      ctx.lineTo(x01, y1);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Barely-there top hang shadow
  ctx.globalAlpha = 1;
  const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.035);
  topGrad.addColorStop(0, 'rgba(140,143,152,0.22)');
  topGrad.addColorStop(1, 'rgba(140,143,152,0)');
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, W, H * 0.035);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
