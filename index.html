<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ─── Dense mesh ──────────────────────────────────────
const COLS = 280;
const ROWS = 220;

// ─── Contrast curve — soft in mid-tones, sharp at edges
// Pulls shadows deeper and keeps highlights clean
function contrast(x, power) {
  // x in [0,1], power > 1 increases contrast at extremes
  return x < 0.5
    ? 0.5 * Math.pow(2 * x, power)
    : 1 - 0.5 * Math.pow(2 * (1 - x), power);
}

// ─── Displacement ────────────────────────────────────
function xDisplace(col, y, H, t) {
  const nx = col / COLS;
  const ny = y / H;

  // Hang: top is pinned, bottom is free — gentle curve
  const hang = Math.pow(ny, 0.55);

  // ── Static creases — softer amplitude than before ──
  // Fewer harmonics, gentler — crease lines are subtle undulations
  const crease =
    Math.sin(nx * Math.PI * 5.0 + 0.30) * 34 +
    Math.sin(nx * Math.PI * 11.0 + 1.7) * 15 +
    Math.sin(nx * Math.PI * 21.0 + 3.1) *  5;

  // ── Breeze — layered traveling waves ──
  // Three frequencies, slightly different speeds, out of phase
  const b1 = Math.sin(ny * 3.8  - t * 0.80 + nx * Math.PI * 2.5)        * 30 * hang;
  const b2 = Math.sin(ny * 7.2  - t * 0.55 + nx * Math.PI * 4.8 + 1.4)  * 16 * hang;
  const b3 = Math.sin(ny * 13.5 - t * 1.10 + nx * Math.PI * 8.2 + 2.8)  *  7 * hang;

  // ── Whole-cloth slow swell (breathing) ──
  const swell = Math.sin(t * 0.28 + nx * Math.PI * 1.8 + 0.5) * 14 * hang;

  return crease + b1 + b2 + b3 + swell;
}

// ─── Draw ─────────────────────────────────────────────
function draw(ms) {
  const t = ms * 0.001;
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  const colW = W / COLS; // nominal column width

  // Build displaced grid — grid[c][r] = screen X
  const grid = [];
  for (let c = 0; c <= COLS; c++) {
    const strip = new Float32Array(ROWS + 1);
    for (let r = 0; r <= ROWS; r++) {
      const y = (r / ROWS) * H;
      strip[r] = (c / COLS) * W + xDisplace(c, y, H, t);
    }
    grid.push(strip);
  }

  // ── Render each quad ──────────────────────────────
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const y0 = (r       / ROWS) * H;
      const y1 = ((r + 1) / ROWS) * H;

      const x00 = grid[c    ][r    ];
      const x10 = grid[c + 1][r    ];
      const x01 = grid[c    ][r + 1];
      const x11 = grid[c + 1][r + 1];

      // Horizontal slope → fold angle → how much it faces the viewer
      // Average top and bottom edges of this quad
      const slopeTop = (x10 - x00) / colW;
      const slopeBot = (x11 - x01) / colW;
      const slope    = (slopeTop + slopeBot) * 0.5;

      // Raw facing value: 1 = fully facing viewer, 0 = edge-on
      const rawFacing = Math.max(0, Math.min(1, 0.5 - slope * 0.5));

      // ── Two-stage shading ────────────────────────
      // The BODY of the crease is soft (gentle mid-tone roll-off)
      // The EDGE where slope is steep gets a sharp shadow
      const softMid   = contrast(rawFacing, 1.6);  // gentle curve
      const hardEdge  = contrast(rawFacing, 3.8);  // aggressive at extremes

      // Blend: mostly soft, but the hard curve drives the deep shadows
      const facing = softMid * 0.55 + hardEdge * 0.45;

      // ── Colour mapping ───────────────────────────
      // White fabric: highlight = 255, shadow = 185
      // Warm shadows (very slightly yellow-grey, not blue)
      const lo = 185, hi = 255;
      const lum = lo + Math.round(facing * (hi - lo));

      // Shadows are fractionally warmer (less blue) for linen feel
      const r_ch = lum;
      const g_ch = lum - 1;
      const b_ch = lum - Math.round((1 - facing) * 9);

      // Alpha: semi-translucent; overlapping folds compound naturally
      ctx.globalAlpha = 0.68;
      ctx.fillStyle   = `rgb(${r_ch},${g_ch},${b_ch})`;

      ctx.beginPath();
      ctx.moveTo(x00, y0);
      ctx.lineTo(x10, y0);
      ctx.lineTo(x11, y1);
      ctx.lineTo(x01, y1);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ── Very faint top hang shadow ────────────────────
  ctx.globalAlpha = 1;
  const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.04);
  topGrad.addColorStop(0, 'rgba(180,175,168,0.28)');
  topGrad.addColorStop(1, 'rgba(180,175,168,0)');
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, W, H * 0.04);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
