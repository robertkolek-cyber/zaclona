<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// Render at low resolution — bilinear upscale = free blur
const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Fold definitions ─────────────────────────────────
// relPos : base horizontal position 0..1
// sigma  : shadow width (normalized, ~0.02–0.05)
// depth  : how dark the shadow is 0..1
// phase  : breeze phase offset per fold (makes each fold move slightly differently)
const FOLDS = [
  // Main drape folds — bold, dramatic
  { relPos: 0.05,  sigma: 0.052, depth: 0.46, phase: 0.00 },
  { relPos: 0.18,  sigma: 0.060, depth: 0.52, phase: 0.80 },
  { relPos: 0.32,  sigma: 0.056, depth: 0.48, phase: 1.60 },
  { relPos: 0.46,  sigma: 0.058, depth: 0.50, phase: 2.40 },
  { relPos: 0.60,  sigma: 0.056, depth: 0.48, phase: 0.30 },
  { relPos: 0.74,  sigma: 0.060, depth: 0.52, phase: 1.10 },
  { relPos: 0.88,  sigma: 0.052, depth: 0.46, phase: 0.40 },
  // Mid creases — clearly visible
  { relPos: 0.11,  sigma: 0.028, depth: 0.22, phase: 2.10 },
  { relPos: 0.25,  sigma: 0.026, depth: 0.20, phase: 1.30 },
  { relPos: 0.39,  sigma: 0.028, depth: 0.22, phase: 0.60 },
  { relPos: 0.53,  sigma: 0.026, depth: 0.20, phase: 1.90 },
  { relPos: 0.67,  sigma: 0.028, depth: 0.22, phase: 0.90 },
  { relPos: 0.81,  sigma: 0.026, depth: 0.20, phase: 2.70 },
  { relPos: 0.95,  sigma: 0.028, depth: 0.22, phase: 1.50 },
  // Surface creases — fine detail
  { relPos: 0.08,  sigma: 0.014, depth: 0.14, phase: 3.10 },
  { relPos: 0.22,  sigma: 0.013, depth: 0.12, phase: 0.50 },
  { relPos: 0.36,  sigma: 0.015, depth: 0.14, phase: 2.30 },
  { relPos: 0.50,  sigma: 0.013, depth: 0.12, phase: 1.00 },
  { relPos: 0.64,  sigma: 0.015, depth: 0.14, phase: 2.80 },
  { relPos: 0.78,  sigma: 0.013, depth: 0.12, phase: 0.20 },
  { relPos: 0.92,  sigma: 0.014, depth: 0.14, phase: 1.70 },
];

// Precomputed sigma² values
FOLDS.forEach(f => { f.s2 = f.sigma * f.sigma; });

// ─── Breeze displacement (returns Δnx) ───────────────
function breezeOffset(ny, t, phase) {
  // hang: top is pinned, bottom swings freely
  const hang = Math.pow(ny, 0.48);
  return (
    Math.sin(ny * 3.2  - t * 0.80 + phase * 1.40) * 0.048 +
    Math.sin(ny * 6.8  - t * 0.55 + phase * 2.20 + 1.2) * 0.022 +
    Math.sin(ny * 13.0 - t * 1.10 + phase * 3.50 + 2.7) * 0.010 +
    Math.sin(t  * 0.22 + phase * 0.70) * 0.024             // slow full-fabric swell
  ) * hang;
}

// ─── Pixel light function ─────────────────────────────
// Returns luminance multiplier: 1 = neutral, <1 = shadow, slightly >1 = sheen
function lightAt(nx, ny, foldXs) {
  let light = 1.0;

  for (let i = 0; i < FOLDS.length; i++) {
    const fold = FOLDS[i];
    const fx   = foldXs[i];
    const dist = nx - fx;
    const d2   = dist * dist;

    // Shadow — Lorentzian (smooth, no exp needed, fast)
    light -= fold.depth / (1 + d2 / fold.s2);

    // Highlight — narrower, offset just to the right of the shadow peak
    const hd   = dist - fold.sigma * 0.70;
    const hs2  = fold.s2 * 0.28;
    light += (fold.depth * 0.65) / (1 + (hd * hd) / hs2);
  }

  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  // Reuse ImageData allocation
  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  // Precompute fold X for each row (avoids trig in inner loop)
  // foldXByRow[i][y] = animated X position of fold i at row y
  const foldXByRow = FOLDS.map((fold, i) => {
    const xs = new Float32Array(SH);
    for (let y = 0; y < SH; y++) {
      xs[y] = fold.relPos + breezeOffset(y / SH, t, fold.phase);
    }
    return xs;
  });

  const rowFoldXs = new Float32Array(FOLDS.length);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;

    // Gather this row's fold positions into a flat array (cache-friendly)
    for (let i = 0; i < FOLDS.length; i++) rowFoldXs[i] = foldXByRow[i][y];

    // Vertical light gradient: slightly brighter near top (window above)
    const vertLight = 1.0 - ny * 0.08;

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx, ny, rowFoldXs) * vertLight;

      // Silk colour: cool-neutral, wider contrast range
      // Shadow end → rgb(112, 116, 130)  ·  White end → rgb(255, 255, 255)
      const l = Math.max(0, Math.min(1.15, lum));

      const r = Math.min(255, Math.round(112 + l * 143));
      const g = Math.min(255, Math.round(116 + l * 139));
      const b = Math.min(255, Math.round(130 + l * 125));

      // Alpha: fabric is translucent; shadows compound it slightly
      const a = Math.round(Math.min(255, 140 + (1 - Math.min(1, l)) * 80));

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  // ── Upscale onto main canvas ──────────────────────────
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width;
  const H = canvas.height;

  // ── Overlay: top hang shadow (curtain rod edge) ───────
  const rodGrad = ctx.createLinearGradient(0, 0, 0, H * 0.055);
  rodGrad.addColorStop(0,   'rgba(160,163,172,0.30)');
  rodGrad.addColorStop(0.5, 'rgba(160,163,172,0.08)');
  rodGrad.addColorStop(1,   'rgba(160,163,172,0)');
  ctx.fillStyle = rodGrad;
  ctx.fillRect(0, 0, W, H * 0.055);

  // ── Overlay: bottom very soft shadow (hem weight) ─────
  const hemGrad = ctx.createLinearGradient(0, H * 0.88, 0, H);
  hemGrad.addColorStop(0, 'rgba(140,143,152,0)');
  hemGrad.addColorStop(1, 'rgba(140,143,152,0.12)');
  ctx.fillStyle = hemGrad;
  ctx.fillRect(0, H * 0.88, W, H * 0.12);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
