<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Fold generation ─────────────────────────────────
// Real curtains: fabric is ~2.5× wider than the rod.
// At the rod the folds are compressed tight together.
// As fabric hangs down, folds fan out to fill the full width.

const NUM_FOLDS = 26;
const GATHER    = 0.40;  // at rod, folds compressed into 40% of width

const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const even = (i + 0.5) / NUM_FOLDS;  // 0..1 evenly spaced

  // Top position: compressed toward center
  const topX = 0.5 + (even - 0.5) * GATHER;

  // Bottom position: spread across full width
  const botX = 0.02 + even * 0.96;

  const isMain = i % 2 === 0;

  FOLDS.push({
    topX,
    botX,
    sigmaT:  isMain ? 0.006 : 0.004,   // very tight at rod
    sigmaB:  isMain ? 0.052 : 0.034,   // wide and loose at hem
    depthT:  isMain ? 0.55  : 0.35,    // deep shadow when compressed
    depthB:  isMain ? 0.32  : 0.20,    // softer when spread open
    phase:   (i * 1.37) % (Math.PI * 2),
    weight:  isMain ? 1.0 : 0.6,
  });
}

// ─── Breeze with neighbour propagation ────────────────
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.55 + phase)                * 0.065 +
    Math.sin(t * 1.15 + phase * 1.8 + 1.4)   * 0.030 +
    Math.sin(t * 0.22 + phase * 0.7 + 2.8)   * 0.045
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
  }
  // 3-pass neighbour blur — fabric tension coupling
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const prev = i > 0              ? src[i - 1] : src[i];
      const next = i < NUM_FOLDS - 1  ? src[i + 1] : src[i];
      swingSmooth[i] = src[i] * 0.50 + prev * 0.25 + next * 0.25;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_FX    = new Float32Array(NUM_FOLDS);
const ROW_S2    = new Float32Array(NUM_FOLDS);
const ROW_DEPTH = new Float32Array(NUM_FOLDS);

function precomputeRow(ny) {
  // spread: how much the folds have fanned out from the gathered top
  // Starts slow (stays bunched), then opens up
  const spread = Math.pow(ny, 0.65);

  // hang: how much the breeze can push the bottom
  const hang = Math.pow(ny, 0.50);
  const extraLoose = ny > 0.7 ? (ny - 0.7) / 0.3 : 0;
  const totalHang  = hang + extraLoose * 0.45;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f = FOLDS[i];

    // X position: interpolate from gathered (topX) to spread (botX)
    const baseX = f.topX + (f.botX - f.topX) * spread;
    ROW_FX[i]   = baseX + swingSmooth[i] * totalHang;

    // Sigma: very tight at top, opens with the spread
    const sigma  = f.sigmaT + (f.sigmaB - f.sigmaT) * spread;
    ROW_S2[i]    = sigma * sigma;

    // Depth: deeper shadows when compressed, softer when open
    ROW_DEPTH[i] = f.depthT + (f.depthB - f.depthT) * spread;
  }
}

// ─── Pixel light ──────────────────────────────────────
function lightAt(nx) {
  let light = 1.0;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx  = ROW_FX[i];
    const s2  = ROW_S2[i];
    const dep = ROW_DEPTH[i];
    const d   = nx - fx;
    const d2  = d * d;

    // Shadow
    light -= dep / (1 + d2 / s2);

    // Highlight — offset right, narrower
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.65;
    const hs2   = s2 * 0.22;
    light += (dep * 0.55) / (1 + (hd * hd) / hs2);
  }

  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    const vertLight = 1.0 - ny * 0.05;

    for (let x = 0; x < SW; x++) {
      const lum = lightAt(x / SW) * vertLight;
      const l   = Math.max(0, Math.min(1.15, lum));

      const r = Math.min(255, Math.round(112 + l * 143));
      const g = Math.min(255, Math.round(116 + l * 139));
      const b = Math.min(255, Math.round(130 + l * 125));
      const a = Math.round(Math.min(255, 138 + (1 - Math.min(1, l)) * 82));

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  // Rod shadow — crisp at very top
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.08);
  rod.addColorStop(0,    'rgba(130,134,148,0.40)');
  rod.addColorStop(0.35, 'rgba(130,134,148,0.10)');
  rod.addColorStop(1,    'rgba(130,134,148,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.08);

  // Hem weight
  const hem = ctx.createLinearGradient(0, H * 0.88, 0, H);
  hem.addColorStop(0, 'rgba(120,124,138,0)');
  hem.addColorStop(1, 'rgba(120,124,138,0.15)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.88, W, H * 0.12);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
