<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { width: 100%; background: #fff; }
    body { width: 100%; margin: 0; padding: 0; background: #fff; }
    canvas { position: fixed; inset: 0; display: block; pointer-events: none; z-index: 1; }

    .project-tile {
      position: fixed;
      top: 42%;
      left: clamp(24px, 5vw, 80px);
      transform: translateY(-50%);
      z-index: 2;
      text-align: left;
      pointer-events: none;
      will-change: transform, opacity;
      mix-blend-mode: difference;
    }

    /* ── Word-mask rise ── */
    @keyframes word-rise {
      from { transform: translateY(108%); }
      to   { transform: translateY(0); }
    }

    /* ── Difference blend materialises as color goes black→white ── */
    @keyframes blend-appear {
      from { color: #000; }
      to   { color: #fff; }
    }

    /* ── Subtitle slides up + fades ── */
    @keyframes sub-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .project-tile h1 {
      font-family: 'Instrument Sans', sans-serif;
      font-size: clamp(24px, 3.8vw, 78px);
      font-weight: 600;
      color: #000;
      line-height: 1.15;
      letter-spacing: -0.02em;
      white-space: nowrap;
      margin-bottom: clamp(10px, 1.4vw, 20px);
      /* blend materialises over the full word-rise duration */
      animation: blend-appear 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    /* Each word is clipped by overflow:hidden on the outer span */
    .word {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }

    /* Inner span is what actually moves */
    .wi {
      display: inline-block;
      transform: translateY(108%);
      animation: word-rise 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .project-tile p {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(10px, 1.1vw, 14px);
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-align: right;
      opacity: 0;
      animation: sub-in 1.0s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }

    .name-lockup {
      position: fixed;
      bottom: clamp(24px, 4vw, 40px);
      left: 0;
      font-family: 'Instrument Sans', sans-serif;
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: 600;
      color: #000;
      white-space: nowrap;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: difference;
      will-change: transform, opacity;
      animation: blend-appear 1.4s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards;
    }
    .name-lockup .word { display: inline-block; overflow: hidden; vertical-align: bottom; }
    .name-lockup .wi {
      display: inline-block;
      transform: translateY(108%);
      animation: word-rise 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── Tiles ── */
    .tile-card {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(380px, 78vw);
      aspect-ratio: 3/4;
      border-radius: 28px;
      padding: clamp(28px, 3.5vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      will-change: transform, opacity;
      backface-visibility: hidden;
      overflow: hidden;
      z-index: 0;
    }
    .tile-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.5;
    }
    .tile-title {
      font-family: 'Instrument Sans', sans-serif;
      font-size: clamp(26px, 3.4vw, 52px);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.03em;
    }
    .tiles-dots {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      pointer-events: none;
      z-index: 0;
    }
    .tiles-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(0,0,0,0.18);
      transition: background 0.3s, transform 0.3s;
    }
    .tiles-dot.active {
      background: rgba(0,0,0,0.65);
      transform: scale(1.5);
    }

  </style>
</head>
<body>

<div class="name-lockup" id="nameLockup">Portfolio of Robert Kolek</div>


<div class="project-tile" id="tile">
  <h1>The screen is just the final act of design</h1>
  <p>scroll to uncover</p>
</div>


<canvas id="c"></canvas>

<!-- Tile cards — fixed, behind curtain canvas (z:0 < canvas z:1) -->
<!-- Invisible until curtain pulls away, then sharpen as it opens -->
<div class="tile-card" style="background:#E89B69;color:#fff;">
  <span class="tile-tag">Brand Identity</span>
  <h2 class="tile-title">Monolith<br>Studio</h2>
</div>
<div class="tile-card" style="background:#EFA84F;color:#fff;">
  <span class="tile-tag">Product Design</span>
  <h2 class="tile-title">Vertex<br>App</h2>
</div>
<div class="tile-card" style="background:#E8956F;color:#fff;">
  <span class="tile-tag">Editorial</span>
  <h2 class="tile-title">Current<br>Magazine</h2>
</div>
<div class="tile-card" style="background:#DFA172;color:#fff;">
  <span class="tile-tag">Interface Design</span>
  <h2 class="tile-title">Flux<br>Dashboard</h2>
</div>
<div class="tile-card" style="background:#EAA876;color:#fff;">
  <span class="tile-tag">Type Design</span>
  <h2 class="tile-title">Forma<br>Typeface</h2>
</div>
<div class="tile-card" style="background:#f0ede8;color:#1c1c1c;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;">
  <span class="tile-tag" style="margin-bottom:0;color:#1c1c1c;">Available for work</span>
  <h2 class="tile-title" style="font-size:clamp(28px,4vw,58px);">Let's make<br>something<br>remarkable</h2>
</div>

<div class="tiles-dots" id="tilesDots"></div>

<!-- 300vh curtain + 900vh tiles = 1200vh scroll, 1300vh body -->
<div style="height:1300vh"></div>

<script>
// ─── Word-mask split ─────────────────────────────────
// Wraps each word in <span class="word"><span class="wi">…</span></span>
// The outer span clips (overflow:hidden), inner span rises up.
// Stagger: 85ms per word, starting at 0.15s.
(function splitWords() {
  const h1 = document.querySelector('.project-tile h1');
  const words = h1.textContent.trim().split(' ');
  h1.innerHTML = words.map((w, i) =>
    `<span class="word"><span class="wi" style="animation-delay:${250 + i * 110}ms">${w}</span></span>`
  ).join(' ');

  // Same word-mask effect for name lockup, starting after headline
  const lockup = document.getElementById('nameLockup');
  const lWords = lockup.textContent.trim().split(' ');
  lockup.innerHTML = lWords.map((w, i) =>
    `<span class="word"><span class="wi" style="animation-delay:${2000 + i * 110}ms">${w}</span></span>`
  ).join(' ');
})();


const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

const tile       = document.getElementById('tile');
const nameLockup = document.getElementById('nameLockup');


function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Scroll state with inertia ───────────────────────
let scrollPull  = 0;
let curtainPull = 0;
let curtainVel  = 0;

function updateScroll() {
  // Curtain only responds to first 300vh of scroll (400vh section – 100vh viewport)
  scrollPull = Math.max(0, Math.min(1, window.scrollY / (3 * innerHeight)));
}
window.addEventListener('scroll', updateScroll, { passive: true });

// ─── Generate folds ──────────────────────────────────
const NUM_FOLDS = 26;
const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const nx = (i + 0.5) / NUM_FOLDS;
  const isMain = i % 2 === 0;
  FOLDS.push({
    relPos: 0.02 + nx * 0.96,
    sigmaT: isMain ? 0.028 : 0.020,
    sigmaB: isMain ? 0.055 : 0.038,
    depth:  isMain ? 0.30  : 0.18,
    phase:  (i * 1.37) % (Math.PI * 2),
    weight: isMain ? 1.0 : 0.6,
  });
}

// ─── Breeze ──────────────────────────────────────────
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.55 + phase)                * 0.060 +
    Math.sin(t * 1.15 + phase * 1.8 + 1.4)   * 0.028 +
    Math.sin(t * 0.22 + phase * 0.7 + 2.8)   * 0.042
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  const swell = 1.0 + windStr * 1.4;
  const pullDampen = 1.0 - curtainPull * 0.65;
  // Tighten slightly during fast scroll — not dramatic, just taut
  const velDampen = Math.max(0.4, 1.0 - Math.abs(curtainVel) * 0.8);
  const dampen = pullDampen * velDampen;
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight * swell * dampen;
  }
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const prev = i > 0              ? src[i - 1] : src[i];
      const next = i < NUM_FOLDS - 1  ? src[i + 1] : src[i];
      swingSmooth[i] = src[i] * 0.50 + prev * 0.25 + next * 0.25;
    }
  }
}

// ─── Mouse breeze ────────────────────────────────────
let mouseNX = -1, mouseNY = -1;
let windTargetCX = 0.5; // instant mouse position
let windCX  = 0.5;      // main wind center — follows with pleasant delay
let windCX2 = 0.5;      // trailing wake — much slower, creates flowing tail
let windDirTarget = 0;
let windDir = 0;
let windStrTarget = 0;
let windStr = 0;

document.addEventListener('mousemove', (e) => {
  const nx = e.clientX / innerWidth;
  const ny = e.clientY / innerHeight;
  if (mouseNX >= 0) {
    const dx = nx - mouseNX;
    const speed = Math.abs(dx) + Math.abs(ny - mouseNY) * 0.4;
    if (speed > 0.002) {
      windTargetCX = nx;
      windDirTarget = Math.sign(dx);
      windStrTarget = Math.min(1.0, windStrTarget + speed * 3.0);
    }
  }
  mouseNX = nx;
  mouseNY = ny;
});
document.addEventListener('mouseleave', () => { mouseNX = -1; mouseNY = -1; });

function updateMouseWind(dt) {
  windCX  += (windTargetCX - windCX)   * Math.min(1.0, dt * 2.5);
  windCX2 += (windTargetCX - windCX2)  * Math.min(1.0, dt * 0.8); // slow trailing wake
  windDir += (windDirTarget - windDir)  * Math.min(1.0, dt * 3.0);
  windStr += (windStrTarget - windStr)  * Math.min(1.0, dt * 2.2); // gentler ramp
  windStrTarget *= Math.pow(0.16, dt); // longer linger
  if (windStr < 0.002 && windStrTarget < 0.002) { windStr = 0; windStrTarget = 0; }
}

// ─── Per-row precompute ───────────────────────────────
// Extra slot for the gathering fold at trailing edge
const ROW_DATA = new Float32Array(NUM_FOLDS * 2);

const foldPull     = new Float32Array(NUM_FOLDS);
const foldPullVel  = new Float32Array(NUM_FOLDS);
let visualPull = 0;      // average fold pull — where the curtain visually is
let curtainEdgeFrac = 1.05; // actual right edge of curtain (0..1+), from prev frame

// Vertical drape lag: bottom of curtain hangs behind top
let bottomPull = 0, bottomPullVel = 0;

function updateFoldPull(dt) {
  // Elegant weight: responsive but never snappy. Return is heavier.
  const returning   = scrollPull < curtainPull;
  const pullSpringK = returning ? 3.0 : 5.0;
  const pullDamping = returning ? 3.5 : 4.0;
  const pullAccel = pullSpringK * (scrollPull - curtainPull) - pullDamping * curtainVel;
  curtainVel  += pullAccel * dt;
  curtainPull += curtainVel * dt;
  curtainPull  = Math.max(0, Math.min(1.0, curtainPull));

  // Bottom follows closer — slight lag, not a big drape
  const bK     = returning ? 3.5 : 5.0;
  const bDamp  = returning ? 3.0 : 3.5;
  const bAccel = bK * (curtainPull - bottomPull) - bDamp * bottomPullVel;
  bottomPullVel += bAccel * dt;
  bottomPull    += bottomPullVel * dt;
  bottomPull     = Math.max(0, Math.min(1.0, bottomPull));

  for (let i = 0; i < NUM_FOLDS; i++) {
    const foldNX = FOLDS[i].relPos;
    const responsiveness = 0.3 + foldNX * foldNX * 10.0;
    const foldThreshold = (1.0 - foldNX) * 0.1;
    const foldTarget = Math.max(0, Math.min(1, (curtainPull - foldThreshold) / (1.0 - foldThreshold)));

    // Neighbors drag each other — cascade wave like real fabric
    const left  = i > 0             ? foldPull[i - 1] : foldPull[i];
    const right = i < NUM_FOLDS - 1 ? foldPull[i + 1] : foldPull[i];
    const coupledTarget = foldTarget * 0.72 + (left + right) * 0.14;

    const accel = responsiveness * (coupledTarget - foldPull[i]) - 3.0 * foldPullVel[i];
    foldPullVel[i] += accel * dt;
    foldPull[i]    += foldPullVel[i] * dt;
    foldPull[i]     = Math.max(0, Math.min(1.2, foldPull[i]));
  }

  // Visual pull — tracks where the curtain actually IS, not where scroll wants it
  let vp = 0;
  for (let i = 0; i < NUM_FOLDS; i++) vp += foldPull[i];
  visualPull = vp / NUM_FOLDS;
}

function precomputeRow(ny, t) {
  const hang = Math.pow(ny, 0.50);
  const extraLoose = ny > 0.7 ? (ny - 0.7) / 0.3 : 0;
  const totalHang  = hang + extraLoose * 0.4;
  const dragLag = 1.0 - ny * ny * 0.18;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f = FOLDS[i];
    let fx = f.relPos + swingSmooth[i] * totalHang;

    // Mouse breeze — layered: sharp push near cursor + wide trailing wake
    if (windStr > 0.002) {
      const dx1 = f.relPos - windCX;
      const dx2 = f.relPos - windCX2;
      const env1 = Math.exp(-dx1 * dx1 / 0.06); // focused near cursor
      const env2 = Math.exp(-dx2 * dx2 / 0.16); // wide trailing wake
      fx += windDir * windStr * (0.038 * env1 + 0.025 * env2) * (0.1 + totalHang * 0.9);
    }

    // Hover warmth — folds near cursor breathe a little more, even when still
    if (mouseNX >= 0) {
      const dx = f.relPos - mouseNX;
      const prox = Math.exp(-dx * dx / 0.04);
      fx += Math.sin(t * 1.5 + f.phase * 1.4) * prox * 0.014 * totalHang;
    }

    // Vertical row pull: top tracks curtainPull, bottom lags via bottomPull
    const ny2 = ny * ny;
    const rowPull = curtainPull * (1 - ny2) + bottomPull * ny2;
    // Horizontal cascade from foldPull[i], blended with row vertical lag
    const effectivePull = foldPull[i] * (1 - ny2) + rowPull * ny2;
    // Slide folds off-screen left (gathered), staggered per fold
    const gatheredX = -1.2 - (NUM_FOLDS - i) * 0.015;
    fx = fx * (1 - effectivePull) + gatheredX * effectivePull;

    const blend = Math.pow(ny, 0.7);
    let sigma = f.sigmaT + (f.sigmaB - f.sigmaT) * blend;

    // Sigma swell — folds billow where wind and wake touch
    if (windStr > 0.002) {
      const dx1 = f.relPos - windCX;
      const dx2 = f.relPos - windCX2;
      const env1 = Math.exp(-dx1 * dx1 / 0.06);
      const env2 = Math.exp(-dx2 * dx2 / 0.16);
      sigma *= 1.0 + windStr * (env1 * 0.22 + env2 * 0.14);
    }

    ROW_DATA[i * 2]     = fx;
    ROW_DATA[i * 2 + 1] = sigma * sigma;
  }

}

// ─── Pixel light ─────────────────────────────────────
function lightAt(nx) {
  let light = 1.0;
  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx  = ROW_DATA[i * 2];
    const s2  = ROW_DATA[i * 2 + 1];
    const d   = nx - fx;
    const d2  = d * d;
    light -= FOLDS[i].depth / (1 + d2 / s2);
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.68;
    const hs2   = s2 * 0.25;
    light += (FOLDS[i].depth * 1.00) / (1 + (hd * hd) / hs2);
  }
  return light;
}

// ─── Text animation state ─────────────────────────────
// Sync lockup left edge to the tile's left edge on each frame
function alignLockup() {
  const rect = tile.getBoundingClientRect();
  nameLockup.style.left = rect.left + 'px';
}

let tileInitialRight = null;
let tileInitialEdge  = null;
let textRight        = null; // smoothed text right edge (px)

function updateText(dt) {
  // Capture initial anchor once — before any JS moves the tile
  if (tileInitialRight === null) {
    tileInitialRight = tile.getBoundingClientRect().right;
    tileInitialEdge  = curtainEdgeFrac;
    textRight        = tileInitialRight + innerWidth * 0.03;
  }

  // Arc shifted right: at rest text is ~12vw right of anchor,
  // as curtain pulls it drifts left, anchor area is the leftmost point
  const curtainShift = (curtainEdgeFrac - tileInitialEdge) * innerWidth;
  const targetRight  = tileInitialRight + innerWidth * 0.03 + curtainShift;

  // Drift toward target with lag — wiggle room
  textRight += (targetRight - textRight) * Math.min(1, dt * 4.5);

  // Hard clamp: never extend past the curtain edge
  const curtainEdgePx = curtainEdgeFrac * innerWidth;
  const clampedRight  = Math.min(textRight, curtainEdgePx);

  tile.style.left      = 'auto';
  tile.style.right     = Math.max(0, innerWidth - clampedRight) + 'px';
  tile.style.transform = 'translateY(-50%)';
  tile.style.webkitMaskImage = 'none';
  tile.style.maskImage       = 'none';

  alignLockup();

  const rawOpacity = 1 - (visualPull - 0.1) / (0.62 - 0.1);
  const opacity = Math.max(0, Math.min(1, rawOpacity));
  tile.style.opacity = opacity;
  if (visualPull > 0.35) nameLockup.style.opacity = opacity;

  nameLockup.style.webkitMaskImage = 'none';
  nameLockup.style.maskImage       = 'none';
}

// ─── Draw loop ───────────────────────────────────────
let imgCache  = null;
let lastFrame = 0;

function draw(ms) {
  const t  = ms * 0.001;
  const dt = lastFrame ? Math.min(0.05, t - lastFrame) : 0.016;
  lastFrame = t;

  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t);
  updateMouseWind(dt);
  updateFoldPull(dt);
  updateText(dt);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny, t);

    // Compute row's right edge once (doesn't depend on x)
    let rowMaxFoldX = -999;
    for (let fi = 0; fi < NUM_FOLDS; fi++) {
      const fx = ROW_DATA[fi * 2];
      const s2 = ROW_DATA[fi * 2 + 1];
      const edgeX = fx + Math.sqrt(s2) * 3.0;
      if (edgeX > rowMaxFoldX) rowMaxFoldX = edgeX;
    }

    // Capture curtain edge near the text row (~42% height) for text clipping
    if (y === Math.round(SH * 0.42)) curtainEdgeFrac = rowMaxFoldX;

    const vertLight = 1.0 - ny * 0.06;

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx) * vertLight;
      const l   = Math.max(0, Math.min(1.20, lum));

      const breathe   = Math.sin(t * 0.06) * 0.12 + Math.sin(t * 0.025) * 0.08;
      const warmZone  = nx * 0.35 + (1.0 - ny) * 0.45 + breathe;
      const warmRaw   = Math.max(0, Math.min(1, (warmZone - 0.20) / 0.55));
      const warmth    = warmRaw * warmRaw * (3 - 2 * warmRaw);
      const peach     = warmth * Math.max(0, Math.min(1, (l - 0.3) / 0.5));

      const r = Math.min(255, Math.round(55 + l * 200  + peach * 55));
      const g = Math.min(255, Math.round(65 + l * 190  + peach * 30));
      const b = Math.min(255, Math.round(105 + l * 150 - peach * 22));

      const edgeFade = Math.max(0, Math.min(1, (rowMaxFoldX - nx) / 0.006));
      const alpha = Math.round(edgeFade * 255);

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = alpha;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, W, H);

  // Rod shadow
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  rod.addColorStop(0,   'rgba(140,148,170,0.22)');
  rod.addColorStop(0.5, 'rgba(140,148,170,0.05)');
  rod.addColorStop(1,   'rgba(140,148,170,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.06);

  // Hem glow
  const hem = ctx.createLinearGradient(0, H * 0.85, 0, H);
  hem.addColorStop(0, 'rgba(240,175,110,0)');
  hem.addColorStop(1, 'rgba(240,175,110,0.14)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  updateTiles();
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

// ─── Tiles carousel ──────────────────────────────────
function interpolate(p, inputs, outputs) {
  if (p <= inputs[0]) return outputs[0];
  if (p >= inputs[inputs.length - 1]) return outputs[outputs.length - 1];
  for (let i = 0; i < inputs.length - 1; i++) {
    if (p >= inputs[i] && p < inputs[i + 1]) {
      const t = (p - inputs[i]) / (inputs[i + 1] - inputs[i]);
      return outputs[i] + t * (outputs[i + 1] - outputs[i]);
    }
  }
  return outputs[outputs.length - 1];
}

const tileCards    = Array.from(document.querySelectorAll('.tile-card'));
const tilesDots    = document.getElementById('tilesDots');
const TOTAL_ITEMS  = tileCards.length;

// Build indicator dots
tileCards.forEach(() => {
  const d = document.createElement('span');
  d.className = 'tiles-dot';
  tilesDots.appendChild(d);
});
const dotEls = Array.from(tilesDots.querySelectorAll('.tiles-dot'));

function updateTiles() {
  // Starts at 0 when curtain is done (scrollY = 3×vh), runs 900vh.
  // Tile 0 center = progress 0 → already at full scale the moment curtain opens.
  const progress = Math.max(0, Math.min(1,
    (window.scrollY - 3 * innerHeight) / (9 * innerHeight)
  ));

  const step    = 1 / TOTAL_ITEMS; // even spacing across 0–1
  const isLarge = innerWidth >= 1440;

  // Blur driven by curtain: starts at 14px, fully sharp when curtain is open
  const blurPx = Math.max(0, (1 - curtainPull) * 14);

  // Dots and tiles hidden behind curtain, revealed as it opens
  tilesDots.style.opacity = curtainPull;

  let activeDot = -1;

  tileCards.forEach((card, i) => {
    const isCTA  = i === TOTAL_ITEMS - 1;
    const center = (i + 0.5) * step;  // centered in each slot
    const start  = center - step * 1.8;  // wider overlap so next tile is visible "in the distance"
    const end    = center + step * 0.85;

    // Scale — enter small ("in the distance"), full at center, shrink on exit
    const scale = isCTA
      ? interpolate(progress, [start, center, end], [0.85, 1.0, 1.05])
      : interpolate(progress, [start, center, end], [0.65, 1, 0.4]);

    // Opacity (5-point: fast fade-in, long hold, short fade-out)
    const opIn  = start + 0.30 * (center - start);
    const opOut = end   - 0.20 * (end - center);
    const opacity = interpolate(progress,
      [start, opIn, center, opOut, end],
      [0, 1, 1, 1, 0]);

    // All tiles enter from right ("in the distance"), sit slightly right at peak, exit left
    let tx = 0;
    if (!isCTA) {
      tx = interpolate(progress, [start, center, end], [18, 2, -100]);
    }

    card.style.transform = `translate(-50%, -50%) translateX(${tx}vw) scale(${scale})`;
    card.style.opacity   = opacity * curtainPull;
    card.style.zIndex    = Math.round(scale * 100);
    card.style.filter    = `blur(${blurPx}px)`;

    // Active dot: switch at 70% bias toward start
    const bias = start + 0.30 * (center - start);
    if (progress >= bias) activeDot = i;
  });

  dotEls.forEach((d, i) => d.classList.toggle('active', i === activeDot));
}

window.addEventListener('scroll', updateTiles, { passive: true });
updateTiles();
</script>
</body>
</html>
