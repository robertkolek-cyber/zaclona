<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fefefe;
    }

    /* ── Ambient light layer behind the curtain ────────── */
    .ambient {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 65% 55% at 52% 40%,
          rgba(255, 248, 235, 0.70) 0%,
          rgba(255, 248, 235, 0.25) 50%,
          transparent 100%),
        radial-gradient(ellipse 80% 70% at 45% 60%,
          rgba(245, 238, 225, 0.40) 0%,
          transparent 100%);
      pointer-events: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* ── Top rod: thin architectural rail ──────────────── */
    .rail {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(to bottom,
        rgba(180, 175, 165, 0.35),
        rgba(180, 175, 165, 0.05));
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

<div class="ambient"></div>
<canvas id="c"></canvas>
<div class="rail"></div>

<script>
// ═══════════════════════════════════════════════════════
//  SHEER CURTAIN — pixel-shader renderer
//
//  Fabric effect:
//  Each "fold" is a Lorentzian gradient (1/(1+d²/σ²)) — a smooth
//  bell-shaped shadow centered on the crease line. ~35 folds are
//  layered together, each with a paired highlight offset to simulate
//  the way fabric catches light on one side of a fold.
//
//  The curtain is rendered at 1/3 resolution onto an offscreen canvas,
//  then upscaled with bilinear interpolation — the upscale itself acts
//  as a free Gaussian blur, giving the fabric its characteristic soft
//  diffused look without any filter overhead.
//
//  Folds are connected via a 4-pass neighbour blur on their swing
//  values, so when one fold moves, adjacent folds are pulled along —
//  simulating real fabric tension.
//
//  Animation is extremely subtle: base amplitudes of 0.018–0.025
//  (≈2% of screen width), with a belly-shaped hang curve that peaks
//  at mid-height so the curtain breathes gently in the center rather
//  than swinging at the bottom.
// ═══════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 3;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Fold generation ─────────────────────────────────
const NUM_FOLDS = 35;
const FOLDS     = [];

for (let i = 0; i < NUM_FOLDS; i++) {
  const nx   = (i + 0.5) / NUM_FOLDS;
  const tier = i % 3;  // 0: main, 1: fine, 2: mid

  FOLDS.push({
    relPos: 0.01 + nx * 0.98,
    sigmaT: [0.022, 0.014, 0.018][tier],   // soft at top
    sigmaB: [0.048, 0.030, 0.038][tier],    // wider at bottom
    depth:  [0.30,  0.16,  0.22 ][tier],
    phase:  (i * 1.618) % (Math.PI * 2),    // golden ratio stagger
    weight: [1.0,   0.55,  0.75 ][tier],
  });
}

// ─── Breeze — extremely subtle ───────────────────────
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.40 + phase)               * 0.025 +
    Math.sin(t * 0.85 + phase * 1.6 + 1.5)   * 0.012 +
    Math.sin(t * 0.18 + phase * 0.7 + 2.9)   * 0.018
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
  }
  // 4-pass neighbour blur — fabric tension
  for (let pass = 0; pass < 4; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const p2 = i > 1              ? src[i-2] : src[Math.max(0, i-1)];
      const p1 = i > 0              ? src[i-1] : src[i];
      const n1 = i < NUM_FOLDS - 1  ? src[i+1] : src[i];
      const n2 = i < NUM_FOLDS - 2  ? src[i+2] : src[Math.min(NUM_FOLDS-1, i+1)];
      swingSmooth[i] = src[i] * 0.36 + (p1+n1) * 0.20 + (p2+n2) * 0.07;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_FX    = new Float32Array(NUM_FOLDS);
const ROW_S2    = new Float32Array(NUM_FOLDS);
const ROW_DEPTH = new Float32Array(NUM_FOLDS);

function precomputeRow(ny) {
  // Sigma blend: soft power curve — folds are already gentle at top
  const blend = Math.pow(ny, 0.65);

  // Belly-shaped hang: peaks at mid-height, gentle at top and bottom
  // The curtain breathes in the center, not swinging at the hem
  const belly = Math.sin(ny * Math.PI) * 0.80 + ny * 0.20;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f = FOLDS[i];

    ROW_FX[i]    = f.relPos + swingSmooth[i] * belly;
    const sigma  = f.sigmaT + (f.sigmaB - f.sigmaT) * blend;
    ROW_S2[i]    = sigma * sigma;
    ROW_DEPTH[i] = f.depth * (1.0 - blend * 0.15); // slightly deeper at top
  }
}

// ─── Pixel light ──────────────────────────────────────
function lightAt(nx) {
  let light = 1.0;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const d  = nx - ROW_FX[i];
    const d2 = d * d;
    const s2 = ROW_S2[i];
    const dep = ROW_DEPTH[i];

    // Shadow
    light -= dep / (1 + d2 / s2);

    // Highlight — subtle bright ridge
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.60;
    const hs2   = s2 * 0.22;
    light += (dep * 0.48) / (1 + (hd * hd) / hs2);
  }

  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx);

      // Window light glow: warm radial, brightest slightly above center
      const cx = nx - 0.50;
      const cy = ny - 0.42;
      const glow = Math.exp(-(cx*cx*2.0 + cy*cy*3.0)) * 0.14;

      // Vertical gradient: subtly brighter top (daylight), slightly dimmer bottom
      const vert = 1.0 - ny * 0.04;

      const l = Math.max(0, Math.min(1.18, lum * vert + glow));

      // ── Warm white palette ──────────────────────
      // Shadow:  rgb(192, 188, 180) — warm grey
      // Peak:    rgb(255, 253, 248) — ivory white
      // Glow:    golden warmth added where light bleeds through
      const warmth = glow * 2.2;

      const r = Math.min(255, Math.round(192 + l * 63  + warmth * 22));
      const g = Math.min(255, Math.round(188 + l * 65  + warmth * 16));
      const b = Math.min(255, Math.round(180 + l * 68  + warmth * 4));

      // Sheer translucency: high base alpha, compounds on overlap
      const a = Math.round(Math.min(255, 175 + (1 - Math.min(1, l)) * 42));

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  // Upscale — bilinear smoothing = soft fabric diffusion
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
