<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Fold definitions ─────────────────────────────────
// relPos  : fixed X anchor at the rod (top), 0..1
// sigmaT  : crease width at top — tight, gathered
// sigmaB  : crease width at bottom — loose, open
// depth   : shadow darkness
// phase   : per-fold breeze phase so each one moves independently
const FOLDS = [
  { relPos: 0.04,  sigmaT: 0.012, sigmaB: 0.042, depth: 0.44, phase: 0.00 },
  { relPos: 0.12,  sigmaT: 0.011, sigmaB: 0.038, depth: 0.40, phase: 1.10 },
  { relPos: 0.20,  sigmaT: 0.013, sigmaB: 0.044, depth: 0.46, phase: 0.50 },
  { relPos: 0.28,  sigmaT: 0.011, sigmaB: 0.038, depth: 0.40, phase: 2.20 },
  { relPos: 0.36,  sigmaT: 0.013, sigmaB: 0.046, depth: 0.46, phase: 0.80 },
  { relPos: 0.44,  sigmaT: 0.011, sigmaB: 0.038, depth: 0.40, phase: 1.70 },
  { relPos: 0.52,  sigmaT: 0.013, sigmaB: 0.046, depth: 0.46, phase: 0.30 },
  { relPos: 0.60,  sigmaT: 0.011, sigmaB: 0.038, depth: 0.40, phase: 2.60 },
  { relPos: 0.68,  sigmaT: 0.013, sigmaB: 0.044, depth: 0.46, phase: 1.00 },
  { relPos: 0.76,  sigmaT: 0.011, sigmaB: 0.038, depth: 0.40, phase: 0.60 },
  { relPos: 0.84,  sigmaT: 0.013, sigmaB: 0.044, depth: 0.46, phase: 1.90 },
  { relPos: 0.92,  sigmaT: 0.011, sigmaB: 0.038, depth: 0.40, phase: 0.90 },
  { relPos: 0.97,  sigmaT: 0.012, sigmaB: 0.042, depth: 0.44, phase: 1.40 },
];

// ─── Breeze: pure time function, NO ny dependency ─────
// This is the key fix: the crease X at the TOP is always relPos (fixed).
// Only the BOTTOM swings. hang(ny) scales from 0→1 top→bottom,
// so the crease path is a nearly-vertical straight line that tilts at the hem.
function breezeSwing(t, phase) {
  return (
    Math.sin(t * 0.60 + phase)               * 0.052 +
    Math.sin(t * 1.25 + phase * 1.7 + 1.3)  * 0.024 +
    Math.sin(t * 0.25 + phase * 0.9 + 2.6)  * 0.036
  );
}

// ─── Per-row precomputed values ───────────────────────
// Returns [foldX, sigma²] for each fold at a given ny
function precomputeRow(ny, t, out) {
  // hang: 0 at rod (top), 1 at hem (bottom)
  // Power < 1 so the loosening starts quickly and is already broad by mid-height
  const hang = Math.pow(ny, 0.6);

  for (let i = 0; i < FOLDS.length; i++) {
    const f      = FOLDS[i];
    // X: fixed anchor + lateral swing scaled by hang
    const fx     = f.relPos + breezeSwing(t, f.phase) * hang;
    // Sigma: narrow at top (tight gather), wider at bottom (loose drape)
    const sigma  = f.sigmaT + (f.sigmaB - f.sigmaT) * ny;
    out[i * 2]   = fx;
    out[i * 2+1] = sigma * sigma;
  }
}

// ─── Pixel light function ─────────────────────────────
function lightAt(nx, rowData) {
  let light = 1.0;
  for (let i = 0; i < FOLDS.length; i++) {
    const fx   = rowData[i * 2];
    const s2   = rowData[i * 2 + 1];
    const d    = nx - fx;
    const d2   = d * d;

    // Shadow
    light -= FOLDS[i].depth / (1 + d2 / s2);

    // Highlight — just right of the shadow peak
    const hd  = d - Math.sqrt(s2) * 0.72;
    const hs2 = s2 * 0.30;
    light += (FOLDS[i].depth * 0.60) / (1 + (hd * hd) / hs2);
  }
  return light;
}

// ─── Draw loop ────────────────────────────────────────
let imgCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  // Precomputed row buffer: [fx0, s2_0, fx1, s2_1, ...]
  const rowData = new Float32Array(FOLDS.length * 2);

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny, t, rowData);

    // Subtle vertical light: slightly brighter at top (window light)
    const vertLight = 1.0 - ny * 0.07;

    for (let x = 0; x < SW; x++) {
      const lum = lightAt(x / SW, rowData) * vertLight;
      const l   = Math.max(0, Math.min(1.15, lum));

      // Cool-neutral palette: shadow → white
      const r = Math.min(255, Math.round(118 + l * 137));
      const g = Math.min(255, Math.round(121 + l * 134));
      const b = Math.min(255, Math.round(133 + l * 122));
      const a = Math.round(Math.min(255, 145 + (1 - Math.min(1, l)) * 75));

      const idx = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  // Rod shadow at top
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  rod.addColorStop(0,   'rgba(150,153,164,0.32)');
  rod.addColorStop(0.6, 'rgba(150,153,164,0.06)');
  rod.addColorStop(1,   'rgba(150,153,164,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.06);

  // Hem shadow at bottom
  const hem = ctx.createLinearGradient(0, H * 0.90, 0, H);
  hem.addColorStop(0, 'rgba(130,133,144,0)');
  hem.addColorStop(1, 'rgba(130,133,144,0.14)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.90, W, H * 0.10);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
