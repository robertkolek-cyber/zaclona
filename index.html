<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #e4e8ee; }

    /* Morning sky — rich blue top, strong peach bottom */
    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 60% 80%,
          rgba(255, 165, 80, 0.60) 0%,
          rgba(255, 165, 80, 0.15) 50%,
          transparent 75%),
        radial-gradient(ellipse 85% 55% at 40% 20%,
          rgba(130, 175, 220, 0.65) 0%,
          rgba(130, 175, 220, 0.15) 55%,
          transparent 80%),
        linear-gradient(172deg,
          #b8cee0 0%,
          #c8d4e0 20%,
          #e0ddd5 42%,
          #f0dfc8 60%,
          #f2cca8 78%,
          #e8b888 100%);
      pointer-events: none;
    }

    canvas { position: fixed; inset: 0; display: block; }

    /* Caustics overlay — rendered on a second canvas */
    .caustics {
      position: fixed;
      inset: 0;
      mix-blend-mode: overlay;
      opacity: 0.35;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="sky"></div>
<canvas id="c"></canvas>
<canvas id="caustics" class="caustics"></canvas>

<script>
// ═══════════════════════════════════════════════════════
//  MAIN CURTAIN CANVAS
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const small = document.createElement('canvas');
const sctx  = small.getContext('2d');
const SCALE = 4;

// ═══════════════════════════════════════════════════════
//  CAUSTICS CANVAS
// ═══════════════════════════════════════════════════════
const causticsCanvas = document.getElementById('caustics');
const cctx           = causticsCanvas.getContext('2d');

const cSmall = document.createElement('canvas');
const csctx  = cSmall.getContext('2d');
const C_SCALE = 6;  // caustics can be lower res — they're blurred anyway

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  small.width   = Math.round(innerWidth  / SCALE);
  small.height  = Math.round(innerHeight / SCALE);

  causticsCanvas.width  = innerWidth;
  causticsCanvas.height = innerHeight;
  cSmall.width  = Math.round(innerWidth  / C_SCALE);
  cSmall.height = Math.round(innerHeight / C_SCALE);
}
window.addEventListener('resize', resize);
resize();

// ─── Folds ────────────────────────────────────────────
const NUM_FOLDS = 26;
const FOLDS = [];
for (let i = 0; i < NUM_FOLDS; i++) {
  const nx = (i + 0.5) / NUM_FOLDS;
  const isMain = i % 2 === 0;
  FOLDS.push({
    relPos: 0.02 + nx * 0.96,
    sigmaT: isMain ? 0.028 : 0.020,
    sigmaB: isMain ? 0.055 : 0.038,
    depth:  isMain ? 0.48  : 0.30,
    phase:  (i * 1.37) % (Math.PI * 2),
    weight: isMain ? 1.0 : 0.6,
  });
}

// ─── Breeze with neighbour propagation ────────────────
function baseSwing(t, phase) {
  return (
    Math.sin(t * 0.55 + phase)               * 0.060 +
    Math.sin(t * 1.15 + phase * 1.8 + 1.4)  * 0.028 +
    Math.sin(t * 0.22 + phase * 0.7 + 2.8)  * 0.042
  );
}

const swingRaw    = new Float32Array(NUM_FOLDS);
const swingSmooth = new Float32Array(NUM_FOLDS);

function computeSwings(t) {
  for (let i = 0; i < NUM_FOLDS; i++) {
    swingRaw[i] = baseSwing(t, FOLDS[i].phase) * FOLDS[i].weight;
  }
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? swingRaw : swingSmooth;
    for (let i = 0; i < NUM_FOLDS; i++) {
      const prev = i > 0             ? src[i-1] : src[i];
      const next = i < NUM_FOLDS - 1 ? src[i+1] : src[i];
      swingSmooth[i] = src[i] * 0.50 + prev * 0.25 + next * 0.25;
    }
  }
}

// ─── Per-row precompute ───────────────────────────────
const ROW_DATA = new Float32Array(NUM_FOLDS * 2);

function precomputeRow(ny) {
  const hang = Math.pow(ny, 0.50);
  const extraLoose = ny > 0.7 ? (ny - 0.7) / 0.3 : 0;
  const totalHang  = hang + extraLoose * 0.4;

  for (let i = 0; i < NUM_FOLDS; i++) {
    const f     = FOLDS[i];
    const fx    = f.relPos + swingSmooth[i] * totalHang;
    const blend = Math.pow(ny, 0.7);
    const sigma = f.sigmaT + (f.sigmaB - f.sigmaT) * blend;
    ROW_DATA[i * 2]     = fx;
    ROW_DATA[i * 2 + 1] = sigma * sigma;
  }
}

function lightAt(nx) {
  let light = 1.0;
  for (let i = 0; i < NUM_FOLDS; i++) {
    const fx  = ROW_DATA[i * 2];
    const s2  = ROW_DATA[i * 2 + 1];
    const d   = nx - fx;
    const d2  = d * d;
    light -= FOLDS[i].depth / (1 + d2 / s2);
    const sigma = Math.sqrt(s2);
    const hd    = d - sigma * 0.68;
    const hs2   = s2 * 0.25;
    light += (FOLDS[i].depth * 0.58) / (1 + (hd * hd) / hs2);
  }
  return light;
}

// ─── Caustic pattern ──────────────────────────────────
// Overlapping sine waves at different angles = refracted light ripples
function causticAt(nx, ny, t) {
  // 4 wave layers at different angles and speeds
  const w1 = Math.sin(nx * 28 + ny * 12 - t * 0.7) *
             Math.cos(nx * 15 - ny * 20 + t * 0.5);
  const w2 = Math.sin(nx * 22 - ny * 18 + t * 0.9 + 1.5) *
             Math.cos(nx * 35 + ny * 8  - t * 0.4);
  const w3 = Math.sin(nx * 40 + ny * 25 - t * 0.6 + 3.0) *
             Math.cos(nx * 18 - ny * 30 + t * 0.8);
  const w4 = Math.sin(nx * 12 + ny * 38 + t * 0.35 + 2.2) *
             Math.cos(nx * 28 - ny * 15 - t * 0.55);

  // Sum and concentrate the peaks (squaring pulls highlights)
  const raw = (w1 + w2 + w3 + w4) * 0.25;
  return raw * raw;
}

// ═══════════════════════════════════════════════════════
//  DRAW LOOP
// ═══════════════════════════════════════════════════════
let imgCache = null;
let caustCache = null;

function draw(ms) {
  const t  = ms * 0.001;
  const SW = small.width;
  const SH = small.height;

  if (!imgCache || imgCache.width !== SW || imgCache.height !== SH) {
    imgCache = sctx.createImageData(SW, SH);
  }
  const data = imgCache.data;

  computeSwings(t);

  // ── Moving sun position ─────────────────────────────
  // Slow arc: starts lower-right, moves to upper-right over ~2 min cycle
  const sunX = 0.58 + Math.sin(t * 0.04) * 0.15;
  const sunY = 0.55 + Math.cos(t * 0.04) * 0.20;

  for (let y = 0; y < SH; y++) {
    const ny = y / SH;
    precomputeRow(ny);

    const vertLight = 1.0 - ny * 0.05;

    for (let x = 0; x < SW; x++) {
      const nx  = x / SW;
      const lum = lightAt(nx) * vertLight;
      const l   = Math.max(0, Math.min(1.20, lum));

      // ── Morning colour model ──────────────────
      // Shadows: sky blue    rgb(125, 155, 200)
      // Peak:    warm white  rgb(255, 250, 240)
      // Highlights push strong peach where sun bleeds through

      const shadow = Math.max(0, 1 - l * 2);
      const warmth = Math.max(0, (l - 0.80) / 0.40);

      // Moving sun glow — peach radial
      const cx = nx - sunX;
      const cy = ny - sunY;
      const sunGlow = Math.exp(-(cx*cx*2.0 + cy*cy*2.8)) * 0.35;

      // Secondary wider sky glow — blue, from top-left
      const bx = nx - 0.30;
      const by = ny - 0.20;
      const skyGlow = Math.exp(-(bx*bx*1.5 + by*by*2.0)) * 0.20;

      const peach = warmth + sunGlow * 2.5;
      const blue  = shadow * 0.8 + skyGlow * 1.5;

      const r = Math.min(255, Math.round(125 + l * 130 + peach * 42 - blue * 5));
      const g = Math.min(255, Math.round(155 + l * 95  + peach * 22 - blue * 2));
      const b = Math.min(255, Math.round(200 + l * 40  - peach * 12 + blue * 18));
      const a = Math.round(Math.min(255, 155 + (1 - Math.min(1, l)) * 60));

      const idx   = (y * SW + x) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = a;
    }
  }

  sctx.putImageData(imgCache, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;

  // Rod shadow — cool blue
  const rod = ctx.createLinearGradient(0, 0, 0, H * 0.06);
  rod.addColorStop(0,   'rgba(110,130,165,0.30)');
  rod.addColorStop(0.5, 'rgba(110,130,165,0.06)');
  rod.addColorStop(1,   'rgba(110,130,165,0)');
  ctx.fillStyle = rod;
  ctx.fillRect(0, 0, W, H * 0.06);

  // Hem — warm peach reflected from floor
  const hem = ctx.createLinearGradient(0, H * 0.88, 0, H);
  hem.addColorStop(0, 'rgba(220,165,110,0)');
  hem.addColorStop(1, 'rgba(220,165,110,0.16)');
  ctx.fillStyle = hem;
  ctx.fillRect(0, H * 0.88, W, H * 0.12);

  // ── Caustics ─────────────────────────────────────────
  const CSW = cSmall.width;
  const CSH = cSmall.height;

  if (!caustCache || caustCache.width !== CSW || caustCache.height !== CSH) {
    caustCache = csctx.createImageData(CSW, CSH);
  }
  const cd = caustCache.data;

  for (let y = 0; y < CSH; y++) {
    const ny = y / CSH;
    for (let x = 0; x < CSW; x++) {
      const nx = x / CSW;
      const c  = causticAt(nx, ny, t);

      // Caustics are brightest in the sun glow area, fade elsewhere
      const cx = nx - sunX;
      const cy = ny - sunY;
      const sunMask = Math.exp(-(cx*cx*1.2 + cy*cy*1.8)) * 1.5;
      const intensity = c * sunMask;

      // Warm caustic light: peach-white
      const rv = Math.min(255, Math.round(intensity * 380));
      const gv = Math.min(255, Math.round(intensity * 300));
      const bv = Math.min(255, Math.round(intensity * 180));

      const ci = (y * CSW + x) * 4;
      cd[ci]   = rv;
      cd[ci+1] = gv;
      cd[ci+2] = bv;
      cd[ci+3] = Math.min(255, Math.round(intensity * 320));
    }
  }

  csctx.putImageData(caustCache, 0, 0);

  cctx.clearRect(0, 0, W, H);
  cctx.imageSmoothingEnabled = true;
  cctx.imageSmoothingQuality = 'high';
  cctx.drawImage(cSmall, 0, 0, W, H);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
