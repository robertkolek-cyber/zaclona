<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curtain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      /* warm soft daylight behind the fabric */
      background:
        radial-gradient(ellipse 70% 80% at 38% 30%, #f7ede0 0%, transparent 65%),
        radial-gradient(ellipse 50% 60% at 72% 20%, #f0e8d5 0%, transparent 60%),
        linear-gradient(170deg, #e8dfd4 0%, #d5cfc8 40%, #c8c4bf 100%);
    }

    .curtain-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<svg class="curtain-svg"
     viewBox="0 0 1000 1000"
     preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- ── Breeze displacement ──────────────────────────────── -->
    <filter id="breeze" x="-5%" y="-2%" width="110%" height="104%"
            color-interpolation-filters="sRGB">

      <!-- Slow organic turbulence — the "air" -->
      <feTurbulence
        type="turbulence"
        baseFrequency="0.0035 0.006"
        numOctaves="5"
        seed="4"
        result="wind">
        <!-- seed morphs so no loop is detectable -->
        <animate attributeName="seed"
                 values="4;11;7;18;3;14;4"
                 dur="22s" repeatCount="indefinite"/>
        <!-- frequency breathes slightly -->
        <animate attributeName="baseFrequency"
                 values="0.0035 0.006;0.004 0.0055;0.003 0.007;0.0035 0.006"
                 dur="14s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      </feTurbulence>

      <!-- Displacement — horizontal stronger than vertical for cloth feel -->
      <feDisplacementMap
        in="SourceGraphic" in2="wind"
        xChannelSelector="R" yChannelSelector="G"
        result="displaced">
        <animate attributeName="scale"
                 values="28;42;22;36;28"
                 dur="14s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
      </feDisplacementMap>

      <!-- Very soft blur to kill aliasing on displaced edges -->
      <feGaussianBlur in="displaced" stdDeviation="0.4"/>
    </filter>

    <!-- ── Fine fabric grain (stays still — it's the weave) ─── -->
    <filter id="weave" x="0%" y="0%" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.65 0.4"
                    numOctaves="4"
                    seed="2"
                    result="grain"/>
      <feColorMatrix type="saturate" values="0" in="grain" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- ── Vertical fold shading (linear stripes) ──────────── -->
    <linearGradient id="folds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="#f5f3f0" stop-opacity="1"/>
      <stop offset="6%"    stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="12%"   stop-color="#eae8e4" stop-opacity="1"/>
      <stop offset="18%"   stop-color="#f8f7f5" stop-opacity="1"/>
      <stop offset="25%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="31%"   stop-color="#ede9e5" stop-opacity="1"/>
      <stop offset="38%"   stop-color="#fafaf8" stop-opacity="1"/>
      <stop offset="44%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%"   stop-color="#f0eee9" stop-opacity="1"/>
      <stop offset="56%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="62%"   stop-color="#eceae6" stop-opacity="1"/>
      <stop offset="69%"   stop-color="#fafaf8" stop-opacity="1"/>
      <stop offset="75%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="81%"   stop-color="#ede9e5" stop-opacity="1"/>
      <stop offset="88%"   stop-color="#f8f6f3" stop-opacity="1"/>
      <stop offset="94%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%"  stop-color="#f0eeea" stop-opacity="1"/>
    </linearGradient>

    <!-- ── Soft top-to-bottom shadow (hang weight) ─────────── -->
    <linearGradient id="hangShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d8d4ce" stop-opacity="0.25"/>
      <stop offset="8%"   stop-color="transparent" stop-opacity="0"/>
      <stop offset="85%"  stop-color="transparent" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8c4be" stop-opacity="0.2"/>
    </linearGradient>

    <!-- ── Light bloom from behind ─────────────────────────── -->
    <radialGradient id="bloom" cx="45%" cy="25%" r="55%">
      <stop offset="0%"   stop-color="#fff8f0" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#fff8f0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ══ CURTAIN ════════════════════════════════════════════ -->
  <!-- All three layers share the same breeze displacement     -->
  <g filter="url(#breeze)">

    <!-- Layer 1: base fabric — semi-transparent white -->
    <rect width="1000" height="1000"
          fill="#fdfcfa"
          fill-opacity="0.82"/>

    <!-- Layer 2: fold shading -->
    <rect width="1000" height="1000"
          fill="url(#folds)"
          fill-opacity="0.55"/>

    <!-- Layer 3: hang shadow top/bottom -->
    <rect width="1000" height="1000"
          fill="url(#hangShadow)"/>

    <!-- Layer 4: woven fabric texture -->
    <rect width="1000" height="1000"
          fill="#f8f6f2"
          fill-opacity="1"
          filter="url(#weave)"/>

    <!-- Layer 5: light bloom bleeding through -->
    <rect width="1000" height="1000"
          fill="url(#bloom)"/>

  </g>

</svg>

</body>
</html>
